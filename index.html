<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Family Hub">
  <title>Family Hub</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .contenedor {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 40px auto 20px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2563eb, #6d28d9);
      color: white;
      font-size: 24px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: 34px;
    }

    p {
      color: #667085;
      font-size: 17px;
    }

    .correcto {
      margin-top: 35px;
      padding: 20px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 7px 24px rgba(15,23,42,.07);
    }
  </style>
</head>

<body>
  <div class="contenedor">
    <div class="logo">D&N</div>

    <h1>Family Hub</h1>
    <p>Agenda y organización familiar</p>

    <div class="correcto">
      <strong>Family Hub está funcionando</strong>
      <p>Esta es la nueva versión móvil.</p>
    </div>
  </div>
</body>
</html>
