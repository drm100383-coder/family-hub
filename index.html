<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family Hub">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="./manifest.json">
<title>Family Hub</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:#f5f7fb;color:#172033;
padding-top:env(safe-area-inset-top);
padding-bottom:calc(76px + env(safe-area-inset-bottom))
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{
position:sticky;top:0;z-index:20;background:rgba(245,247,251,.96);
backdrop-filter:blur(12px);padding:14px 18px 10px;border-bottom:1px solid #e5e7eb
}
.cabecera{max-width:700px;margin:auto;display:flex;align-items:center;justify-content:space-between}
.marca{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2563eb,#6d28d9);color:white;font-weight:900;font-size:14px}
.titulo{font-size:20px;font-weight:900}
.sub{font-size:11px;color:#667085;margin-top:2px}
.salir{border:0;background:#e9eef8;color:#344054;border-radius:10px;padding:9px 11px;font-size:12px;font-weight:800}
main{max-width:700px;margin:auto;padding:18px;overflow:hidden}
.pantalla{display:none;min-width:0}
.pantalla.activa{display:block}

.bienvenida{margin-bottom:18px}
.bienvenida h1,.cabPantalla h1{margin:0;font-size:28px}
.bienvenida p{margin:6px 0 0;color:#667085}
.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px}
.dato{background:white;border-radius:16px;padding:16px 5px;text-align:center;box-shadow:0 4px 16px rgba(15,23,42,.05)}
.numero{display:block;font-size:25px;font-weight:900}
.etiqueta{display:block;margin-top:3px;color:#667085;font-size:9px;font-weight:800;text-transform:uppercase}

.tarjeta{
background:white;border-radius:18px;padding:18px;margin-bottom:14px;
box-shadow:0 4px 16px rgba(15,23,42,.05);min-width:0
}
.tarjeta h2{font-size:18px;margin:0 0 14px}

.subtituloInicio{font-size:13px;font-weight:900;margin:15px 0 4px;color:#475467}
.subtituloInicio.rojo{color:#b42318}
.subtituloInicio.azul{color:#2563eb}

.inicioVacia{
padding:13px 15px;
margin-bottom:10px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}
.inicioVacia h2{font-size:16px;margin:0}
.inicioVacia .vacio{padding:0;text-align:right;font-size:12px}

.proximoDato{font-size:10px!important;line-height:1.15}

.proximamenteItem{
padding:10px 0;
border-bottom:1px solid #eaecf0
}
.proximamenteItem:last-child{border-bottom:0}
.proximamenteFecha{
font-size:11px;
font-weight:900;
color:#2563eb;
margin-bottom:3px
}

.cumpleBadge{
font-size:9px;
background:#fff1f2;
color:#be123c;
border-radius:999px;
padding:3px 6px;
margin-left:5px;
font-weight:900
}

.aniversarioBadge{
font-size:9px;
background:#f5f3ff;
color:#6d28d9;
border-radius:999px;
padding:3px 6px;
margin-left:5px;
font-weight:900
}

.evento,.tarea{
padding:13px 0;
border-bottom:1px solid #eaecf0;
display:flex;
gap:11px;
align-items:flex-start;
min-width:0
}
.evento:last-child,.tarea:last-child{border-bottom:0}
.evento{cursor:pointer}

.barra{
width:6px;
min-width:6px;
align-self:stretch;
min-height:46px;
border-radius:5px
}

.evento-contenido,.tarea-contenido{
flex:1;
min-width:0;
overflow:hidden
}

.evento-titulo,.tarea-titulo{
font-weight:800;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.evento-meta,.tarea-meta{
font-size:13px;
color:#667085;
margin-top:4px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.evento-personas,.tarea-personas{
font-size:12px;
color:#667085;
margin-top:5px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.vacio{
color:#98a2b3;
text-align:center;
padding:18px 5px;
font-size:14px
}

.badgeDia{
font-size:9px;
font-weight:900;
color:#475467;
background:#eef2f6;
border-radius:999px;
padding:3px 6px;
margin-left:5px;
white-space:nowrap
}

.prioridadBang{
display:inline-flex;
align-items:center;
justify-content:center;
width:17px;
height:17px;
border-radius:50%;
background:#fee2e2;
color:#b42318;
font-size:11px;
font-weight:900;
margin-left:5px
}

.anualBadge{
font-size:9px;
background:#fff7d6;
color:#8a6100;
border-radius:999px;
padding:3px 6px;
margin-left:5px;
font-weight:900
}

.filtros{
display:flex;
gap:7px;
overflow:auto;
padding-bottom:5px;
margin-bottom:14px
}

.filtro{
white-space:nowrap;
border:1px solid #d0d5dd;
background:white;
border-radius:999px;
padding:8px 12px;
font-size:12px;
font-weight:800;
color:#475467
}

.filtro.activo{
background:#172033;
color:white;
border-color:#172033
}

.cabAgenda,.cabPantalla{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px;
gap:10px
}

.cabAgenda h1{font-size:25px;margin:0}

.vistas{
display:grid;
grid-template-columns:repeat(3,1fr);
background:#e9eef8;
border-radius:12px;
padding:4px;
margin-bottom:12px
}

.vistaBtn{
border:0;
background:transparent;
padding:9px;
border-radius:9px;
color:#667085;
font-size:13px;
font-weight:900
}

.vistaBtn.activo{
background:white;
color:#2563eb;
box-shadow:0 2px 8px rgba(15,23,42,.08)
}

.navegadorFecha{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:6px;
gap:8px
}

.navFecha{
width:38px;
height:38px;
min-width:38px;
border:0;
border-radius:11px;
background:white;
color:#344054;
font-size:20px;
font-weight:900;
box-shadow:0 2px 8px rgba(15,23,42,.05)
}

.tituloPeriodo{
flex:1;
text-align:center;
font-weight:900;
min-width:0
}

.hoyBtn{
border:0;
background:#e9eef8;
color:#2563eb;
padding:9px 11px;
border-radius:10px;
font-size:12px;
font-weight:900
}

.contadorPeriodo{
text-align:center;
color:#667085;
font-size:11px;
font-weight:700;
margin-bottom:13px;
min-height:15px
}

.semanaCompacta{
background:white;
border-radius:18px;
padding:10px 6px;
box-shadow:0 4px 16px rgba(15,23,42,.05);
margin-bottom:12px;
overflow:hidden
}

.franjaSemana{
display:grid;
grid-template-columns:repeat(7,minmax(0,1fr));
gap:3px
}

.diaCompacto{
border:0;
background:transparent;
border-radius:13px;
min-width:0;
padding:7px 1px;
color:#172033
}

.letraDia{
display:block;
font-size:10px;
font-weight:900;
color:#667085;
text-transform:uppercase;
margin-bottom:5px
}

.numeroDiaCompacto{
width:30px;
height:30px;
margin:auto;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
font-weight:900
}

.diaCompacto.hoy .numeroDiaCompacto{
background:#2563eb;
color:white
}

.diaCompacto.hoy .letraDia{color:#2563eb}

.puntosSemana{
height:11px;
display:flex;
align-items:center;
justify-content:center;
gap:2px;
margin-top:4px;
overflow:hidden
}

.puntoSemana{
width:6px;
height:6px;
border-radius:50%;
flex:none
}

.resumenSemana{
background:white;
border-radius:18px;
padding:4px 14px;
box-shadow:0 4px 16px rgba(15,23,42,.05);
overflow:hidden
}

.bloqueDiaSemana{
padding:9px 0;
border-bottom:1px solid #eaecf0;
min-width:0
}

.bloqueDiaSemana:last-child{border-bottom:0}
.bloqueDiaSemana.sinEventos{padding:7px 0}

.bloqueDiaSemana.esHoy{
margin:4px -6px;
padding-left:6px;
padding-right:6px;
border-radius:12px;
background:#f0f6ff
}

.cabResumenDia{
display:flex;
justify-content:space-between;
align-items:center;
gap:6px;
cursor:pointer;
min-width:0
}

.fechaResumenDia{
font-size:13px;
font-weight:900;
min-width:0;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.bloqueDiaSemana.esHoy .fechaResumenDia{color:#2563eb}

.contadorDia{
font-size:10px;
font-weight:800;
color:#667085;
background:#f2f4f7;
border-radius:999px;
padding:4px 7px;
flex:none
}

.sinEventosSemana{
color:#98a2b3;
font-size:11px;
white-space:nowrap;
flex:none
}

.eventoSemanaLinea{
display:grid;
grid-template-columns:6px 62px minmax(0,1fr);
align-items:center;
gap:8px;
padding:8px 3px;
margin-top:4px;
border-radius:10px;
min-width:0
}

.barraSemana{
width:6px;
height:38px;
border-radius:4px
}

.horaSemana{
color:#667085;
font-size:11px;
font-weight:800;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.textoSemana{min-width:0;overflow:hidden}

.tituloSemanaEvento{
font-weight:800;
font-size:13px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.personasSemana{
font-size:10px;
color:#98a2b3;
margin-top:2px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.calendario{
background:white;
border-radius:18px;
padding:10px;
box-shadow:0 4px 16px rgba(15,23,42,.05);
overflow:hidden
}

.cabCalendario,.rejillaMes{
display:grid;
grid-template-columns:repeat(7,minmax(0,1fr))
}

.cabCalendario div{
text-align:center;
font-size:11px;
font-weight:900;
color:#667085;
padding:7px 0
}

.celdaDia{
min-height:76px;
padding:4px 2px;
border-radius:10px;
cursor:pointer;
overflow:hidden;
min-width:0
}

.celdaVacia{min-height:76px}

.celdaDia.seleccionado{
background:#eaf2ff;
outline:2px solid #bfdbfe
}

.numMes{
width:27px;
height:27px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
font-size:13px;
font-weight:800;
margin:auto
}

.celdaDia.hoy .numMes{
background:#2563eb;
color:white
}

.puntosMes{
display:flex;
gap:2px;
justify-content:center;
flex-wrap:wrap;
margin-top:3px
}

.puntoMes{
width:6px;
height:6px;
border-radius:50%
}

.textoEventoMes{
font-size:8px;
font-weight:800;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-top:3px;
text-align:center;
color:#475467
}

.masMes{
text-align:center;
font-size:8px;
color:#667085;
margin-top:1px
}

.detalleMes{margin-top:14px}

.estado-tareas{
display:flex;
gap:7px;
margin-bottom:14px;
overflow:auto
}

.progreso{
height:7px;
background:#eaecf0;
border-radius:10px;
overflow:hidden;
margin-top:9px
}

.progreso span{
display:block;
height:100%;
background:#2563eb;
border-radius:10px
}

.completarTarea{
width:23px;
height:23px;
min-width:23px;
border-radius:50%;
border:2px solid #98a2b3;
background:white;
padding:0
}

.completarTarea.hecha{
background:#16a34a;
border-color:#16a34a;
color:white
}

.tarea.completada .tarea-titulo{
text-decoration:line-through;
color:#98a2b3
}

.tarea.vencida{
background:#fff7f7;
margin:0 -8px;
padding-left:8px;
padding-right:8px;
border-radius:12px
}

.tarea.hoyTarea{
background:#f7fbff;
margin:0 -8px;
padding-left:8px;
padding-right:8px;
border-radius:12px
}

.estadoVencida{color:#b42318;font-weight:900}
.estadoHoy{color:#2563eb;font-weight:900}

.nuevoCheck{
display:flex;
gap:8px;
margin-bottom:8px
}

.nuevoCheck input{flex:1}

.nuevoCheck button{
border:0;
border-radius:10px;
background:#eef2f6;
padding:0 13px;
font-weight:900
}

.itemEditor{
display:flex;
gap:8px;
align-items:center;
background:#f8fafc;
border-radius:10px;
padding:9px;
margin-top:7px
}

.itemEditor span{flex:1;font-size:13px}

.itemEditor button{
border:0;
background:transparent;
color:#b42318;
font-weight:900
}

.checkFicha{
display:flex;
align-items:flex-start;
gap:9px;
margin:8px 0;
cursor:pointer
}

.checkFicha input{
width:18px;
height:18px;
flex:none
}

.checkFicha.hecho span{
text-decoration:line-through;
color:#98a2b3
}

.semanaInicioDia{margin-bottom:15px}

.semanaInicioTitulo{
font-size:12px;
font-weight:900;
color:#475467;
margin-bottom:4px
}

.semanaInicioTitulo.hoy{color:#2563eb}

.irAgendaDia{
border:0;
background:#eef4ff;
color:#2563eb;
border-radius:8px;
padding:5px 8px;
font-size:10px;
font-weight:900;
margin-left:7px
}

.modal-fondo{
display:none;
position:fixed;
inset:0;
z-index:50;
background:rgba(15,23,42,.45);
padding:20px;
align-items:flex-end;
justify-content:center
}

.modal-fondo.visible{display:flex}

.modal{
background:white;
width:100%;
max-width:600px;
max-height:90vh;
overflow:auto;
border-radius:24px 24px 16px 16px;
padding:22px
}

.modal h2{margin:0 0 18px}

.campo{margin-bottom:14px}

.campo label{
display:block;
font-size:12px;
font-weight:800;
margin-bottom:6px;
color:#344054
}

.campo input,.campo select,.campo textarea{
width:100%;
border:1px solid #d0d5dd;
border-radius:11px;
padding:12px;
background:white;
color:#172033
}

.campo textarea{
min-height:75px;
resize:vertical
}

.dos{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.checks{
display:flex;
flex-wrap:wrap;
gap:8px
}

.check{
border:1px solid #d0d5dd;
border-radius:999px;
padding:8px 11px;
font-size:12px
}

.check input{
width:auto;
margin-right:5px
}

.acciones{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:18px
}

.cancelar,.guardar,.editarFicha,.eliminarFicha,.duplicarFicha,.opcionSerie{
border:0;
border-radius:12px;
padding:13px;
font-weight:900
}

.cancelar{background:#eef2f6;color:#344054}
.guardar,.editarFicha{background:#2563eb;color:white}
.eliminarFicha{background:#fef2f2;color:#b42318}
.duplicarFicha{background:#eef2ff;color:#4338ca}

.fichaEventoTitulo{
font-size:24px;
font-weight:900;
margin:4px 0 18px;
overflow-wrap:anywhere
}

.fichaFila{
display:flex;
gap:12px;
padding:10px 0;
border-bottom:1px solid #eaecf0
}

.fichaIcono{
width:28px;
text-align:center;
font-size:18px;
flex:none
}

.fichaTexto{
flex:1;
min-width:0
}

.fichaLabel{
font-size:10px;
color:#98a2b3;
font-weight:900;
text-transform:uppercase
}

.fichaValor{
margin-top:3px;
font-size:14px;
font-weight:700;
overflow-wrap:anywhere
}

.accionesFicha{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:20px
}

.cerrarFicha{
width:100%;
margin-top:10px;
border:0;
border-radius:12px;
padding:12px;
background:#eef2f6;
color:#344054;
font-weight:900
}

.opcionesSerie{
display:grid;
gap:9px
}

.opcionSerie{background:#eef4ff;color:#2563eb}
.opcionSerie.peligro{background:#fef2f2;color:#b42318}
.opcionSerie.cancel{background:#eef2f6;color:#475467}

.accionesRapidas{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.accionRapida{
border:0;
border-radius:16px;
padding:18px 12px;
font-weight:900;
font-size:15px
}

.accionEvento{
background:#eaf2ff;
color:#2563eb
}

.accionTarea{
background:#eefbf3;
color:#15803d
}

.login{
min-height:75vh;
display:flex;
align-items:center;
justify-content:center
}

.loginbox{
width:100%;
max-width:430px;
background:white;
padding:24px;
border-radius:22px;
box-shadow:0 8px 28px rgba(15,23,42,.08)
}

.loginbox h1{margin-top:0}

.loginbox input{
width:100%;
padding:14px;
margin-top:12px;
border:1px solid #d0d5dd;
border-radius:12px
}

.loginbox button{
width:100%;
margin-top:15px;
padding:14px;
border:0;
border-radius:12px;
background:#2563eb;
color:white;
font-weight:900
}

.error{
color:#b42318;
margin-top:12px;
font-size:13px
}

.fab{
position:fixed;
left:50%;
bottom:calc(18px + env(safe-area-inset-bottom));
transform:translateX(-50%);
width:48px;
height:48px;
border-radius:50%;
border:4px solid white;
background:#2563eb;
color:white;
font-size:28px;
font-weight:400;
line-height:1;
padding:0;
box-shadow:0 4px 14px rgba(37,99,235,.25);
z-index:30
}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
z-index:25;
height:calc(68px + env(safe-area-inset-bottom));
padding-bottom:env(safe-area-inset-bottom);
background:white;
border-top:1px solid #e5e7eb;
display:grid;
grid-template-columns:1fr 1fr 64px 1fr 1fr;
align-items:center
}

.navbtn{
border:0;
background:white;
color:#667085;
font-size:12px;
font-weight:800;
height:100%
}

.navbtn.activo{color:#2563eb}

.navInicio{grid-column:1}
.navAgenda{grid-column:2}
.navTareas{grid-column:4}
.navHueco{grid-column:3;pointer-events:none}

.siguienteInicio{
background:#f8fafc;
border:1px solid #e8edf4;
border-radius:14px;
padding:11px 12px;
margin:-2px 0 12px;
display:flex;
align-items:center;
gap:10px
}

.siguienteInicioIcono{
width:34px;
height:34px;
border-radius:11px;
background:#eaf2ff;
display:flex;
align-items:center;
justify-content:center;
font-size:17px;
flex:none
}

.siguienteInicioTexto{
min-width:0;
flex:1
}

.siguienteInicioLabel{
font-size:9px;
font-weight:900;
color:#98a2b3;
text-transform:uppercase
}

.siguienteInicioTitulo{
font-size:13px;
font-weight:900;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-top:2px
}

.siguienteInicioMeta{
font-size:10px;
color:#667085;
margin-top:2px
}

.tarjetaSemanaVacia{
padding:13px 15px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.tarjetaSemanaVacia h2{
font-size:16px;
margin:0
}

.tarjetaSemanaVacia .vacio{
padding:0;
text-align:right;
font-size:12px
}

.compraBadge{
font-size:10px;
background:#fff7d6;
color:#8a6100;
border-radius:999px;
padding:3px 6px;
margin-left:5px;
font-weight:900
}

.sinFechaBloque{
background:#fafbfc;
border:1px dashed #d0d5dd;
border-radius:14px;
padding:0 10px 5px;
margin-top:14px

function fechaLocal(d=new Date()){
return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`
}

function desdeFechaLocal(s){
const [y,m,d]=s.split("-").map(Number);
return new Date(y,m-1,d,12)
}

function sumarDias(f,n){
const d=new Date(f);
d.setDate(d.getDate()+n);
d.setHours(12,0,0,0);
return d
}

function lunesDeSemana(f){
const d=new Date(f);
const x=d.getDay();
d.setDate(d.getDate()+(x===0?-6:1-x));
d.setHours(12,0,0,0);
return d
}

function mismoDia(a,b){
return fechaLocal(a)===fechaLocal(b)
}

function escapar(t=""){
const d=document.createElement("div");
d.textContent=String(t);
return d.innerHTML
}

function cap(t=""){
return t.charAt(0).toUpperCase()+t.slice(1)
}

function fechaBonita(f){
if(!f)return"";
const d=desdeFechaLocal(f);
const dia=new Intl.DateTimeFormat("es-ES",{weekday:"long"}).format(d);
const mes=new Intl.DateTimeFormat("es-ES",{month:"long"}).format(d);
return `${cap(dia)}, ${d.getDate()} de ${mes}`
}

function tituloMes(f){
return `${cap(new Intl.DateTimeFormat("es-ES",{month:"long"}).format(f))} de ${f.getFullYear()}`
}

function tituloSemana(l,d){
if(l.getMonth()===d.getMonth()&&l.getFullYear()===d.getFullYear()){
return `${l.getDate()} – ${d.getDate()} ${new Intl.DateTimeFormat("es-ES",{month:"long"}).format(l)}`
}
return `${new Intl.DateTimeFormat("es-ES",{day:"numeric",month:"short"}).format(l).replace(".","")} – ${new Intl.DateTimeFormat("es-ES",{day:"numeric",month:"short"}).format(d).replace(".","")}`
}

function diasEntre(a,b){
return Math.round((desdeFechaLocal(b)-desdeFechaLocal(a))/86400000)
}

function ultimoDiaMes(y,m){
return new Date(y,m+1,0,12).getDate()
}

function mesesEntre(a,b){
return (b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()
}

function coloresPersonas(n=[]){
return n.map(v=>familia.find(x=>x.nombre===v)?.color).filter(Boolean)
}

function franjasPersonas(n=[]){
const c=coloresPersonas(n);

if(!c.length)return "#43A047";
if(c.length===1)return c[0];

const paso=100/c.length;
let partes=[];

c.forEach((x,i)=>{
partes.push(
`${x} ${i*paso}%`,
`${x} ${(i+1)*paso}%`
)
});

return `linear-gradient(to bottom,${partes.join(",")})`
}

function colorSimple(n=[]){
return coloresPersonas(n)[0]||"#43A047"
}

function textoHora(e){
return e.todoDia
?"Todo el día"
:e.horaInicio&&e.horaFin
?`${e.horaInicio}–${e.horaFin}`
:(e.horaInicio||"")
}

function duracionEvento(e){
return e.fechaFin&&e.fechaFin>=e.fecha
?diasEntre(e.fecha,e.fechaFin)
:0
}

function fechaMensualValida(i,o,n){
const dif=mesesEntre(i,o);
if(dif<0||dif%n)return false;

return o.getDate()===
Math.min(
i.getDate(),
ultimoDiaMes(o.getFullYear(),o.getMonth())
)
}

function fechaAnualValida(i,o,n){
const dif=o.getFullYear()-i.getFullYear();

if(
dif<0||
dif%n||
o.getMonth()!==i.getMonth()
)return false;

return o.getDate()===
Math.min(
i.getDate(),
ultimoDiaMes(o.getFullYear(),o.getMonth())
)
}

function inicioRecurrenteEnFecha(e,f){

if(
!e.fecha||
f<e.fecha||
(e.finRepeticion&&f>e.finRepeticion)||
(e.excepciones||[]).includes(f)
)return false;

if(f===e.fecha)return true;
if(!e.repeticion)return false;

const i=desdeFechaLocal(e.fecha);
const o=desdeFechaLocal(f);
const n=Math.max(1,+e.intervaloRepeticion||1);

if(e.repeticion==="Semanal"){
return diasEntre(e.fecha,f)%(7*n)===0
}

if(e.repeticion==="Mensual"){
return fechaMensualValida(i,o,n)
}

if(e.repeticion==="Anual"){
return fechaAnualValida(i,o,n)
}

return false
}

function inicioAparicionQueContiene(e,f){

const d=duracionEvento(e);
const o=desdeFechaLocal(f);

for(let i=0;i<=d;i++){

const p=fechaLocal(sumarDias(o,-i));

if(inicioRecurrenteEnFecha(e,p)){
return p
}

}

return null
}

function eventosFiltrados(){
return filtroAgenda==="Todos"
?eventos
:eventos.filter(
e=>(e.participantes||[]).includes(filtroAgenda)
)
}

function eventosEnFechaBase(f,lista){
return lista
.filter(e=>inicioAparicionQueContiene(e,f))
.map(e=>({
...e,
fechaAparicion:inicioAparicionQueContiene(e,f),
fechaVista:f
}))
}

function eventosEnFecha(f){
return eventosEnFechaBase(f,eventosFiltrados())
}

function eventosEnFechaTodos(f){
return eventosEnFechaBase(f,eventos)
}

function aparicionesEntre(i,f){
let r=[];

for(let d=new Date(i);d<=f;d=sumarDias(d,1)){
r.push(...eventosEnFecha(fechaLocal(d)))
}

return r
}

function aparicionesEntreTodos(i,f){
let r=[];

for(let d=new Date(i);d<=f;d=sumarDias(d,1)){
r.push(...eventosEnFechaTodos(fechaLocal(d)))
}

return r
}

function posicionMultiDia(e,f){

const inicio=
e.fechaAparicion||
inicioAparicionQueContiene(e,f);

if(!inicio||duracionEvento(e)<1)return"";

const pos=diasEntre(inicio,f)+1;
const total=duracionEvento(e)+1;

return `Día ${pos}/${total}`
}

  function estadoT(t){
if(t.completada||!t.fechaLimite)return"";

return t.fechaLimite<fechaLocal()
?"vencida"
:t.fechaLimite===fechaLocal()
?"hoy"
:""
}

function prioridadN(p){
return p==="Alta"?0:p==="Normal"?1:2
}

function ordenarTareas(l){

return [...l].sort((a,b)=>{

const g=t=>
t.completada?4:
estadoT(t)==="vencida"?0:
estadoT(t)==="hoy"?1:
t.fechaLimite?2:3;

return g(a)-g(b)
||prioridadN(a.prioridad)-prioridadN(b.prioridad)
||(a.fechaLimite||"9999").localeCompare(b.fechaLimite||"9999")

})

}

async function completarTarea(t){

if(!t.repeticion){

return updateDoc(
doc(db,"tareas",t.id),
{completada:!t.completada}
)

}

if(!t.fechaLimite){

return alert(
"Esta tarea recurrente no tiene fecha límite. Edítala y añade una fecha."
)

}

const d=desdeFechaLocal(t.fechaLimite);
const n=Math.max(1,+t.intervaloRepeticion||1);

let s;

if(t.repeticion==="Semanal"){

s=sumarDias(d,7*n);

}else if(t.repeticion==="Mensual"){

s=new Date(
d.getFullYear(),
d.getMonth()+n,
1,
12
);

s.setDate(
Math.min(
d.getDate(),
ultimoDiaMes(
s.getFullYear(),
s.getMonth()
)
)
);

}else{

s=new Date(
d.getFullYear()+n,
d.getMonth(),
Math.min(
d.getDate(),
ultimoDiaMes(
d.getFullYear()+n,
d.getMonth()
)
),
12
);

}

const f=fechaLocal(s);

if(
t.finRepeticion &&
f>t.finRepeticion
){

return updateDoc(
doc(db,"tareas",t.id),
{completada:true}
)

}

await updateDoc(
doc(db,"tareas",t.id),
{
fechaLimite:f,
completada:false,
checklist:(t.checklist||[])
.map(x=>({...x,hecho:false}))
}
);

}

const hb=
b.dato.todoDia
?"00:00"
:(b.dato.horaInicio||"23:59");

return ha.localeCompare(hb)

}

return a.tipo==="evento"?-1:1

});

return candidatos[0]

}

function renderSiguienteInicio(){

const p=proximoElemento();

if(!p){

$("siguienteInicio").innerHTML="";
$("nProximo").textContent="—";
$("etiquetaProximo").textContent="Próximo";
return

}

$("nProximo").textContent=
p.dias===0
?"HOY"
:p.dias;

$("etiquetaProximo").textContent=
p.dias===0
?"Próximo"
:p.dias===1
?"Día"
:"Días";

const icono=
p.tipo==="tarea"
?(p.dato.categoria==="Compras"?"🛒":"✓")
:p.dato.categoria==="Cumpleaños"
?"🎂"
:p.dato.categoria==="Aniversario"
?"♥"
:"📅";

const cuando=
p.dias===0
?"Hoy"
:p.dias===1
?"Mañana"
:`Dentro de ${p.dias} días`;

$("siguienteInicio").innerHTML=`

<div
class="siguienteInicio"
data-siguiente-tipo="${p.tipo}"
data-siguiente-id="${p.dato.id}"
data-siguiente-fecha="${p.fecha}">

<div class="siguienteInicioIcono">
${icono}
</div>

<div class="siguienteInicioTexto">

<div class="siguienteInicioLabel">
Siguiente
</div>

<div class="siguienteInicioTitulo">
${escapar(p.titulo)}
</div>

<div class="siguienteInicioMeta">
${cuando}
${p.hora?" · "+escapar(p.hora):""}
</div>

</div>
</div>
`;

const b=
$("siguienteInicio")
.querySelector("[data-siguiente-id]");

if(b){

b.onclick=()=>{

if(p.tipo==="evento"){

abrirFichaEvento(
p.dato.id,
p.dato.fechaAparicion||p.fecha
);

}else{

abrirFichaTarea(p.dato.id)

}

}

}

}

function renderInicio(){

const hoy=fechaLocal();

const ev=
eventosEnFechaTodos(hoy);

const pend=
tareas.filter(t=>!t.completada);

const hoyT=
pend.filter(
t=>t.fechaLimite===hoy
);

const venc=
pend.filter(
t=>
t.fechaLimite &&
t.fechaLimite<hoy
);

$("nHoy").textContent=
ev.length+hoyT.length;

$("nTareas").textContent=
pend.length;

renderSiguienteInicio();

const tHoy=
$("tarjetaHoy");

tHoy.classList.toggle(
"inicioVacia",
!ev.length
);

insertarEventos(
$("eventosHoy"),
ev
);

let html="";

if(venc.length){

html+=`
<div class="subtituloInicio rojo">
Vencidas · ${venc.length}
</div>
<div id="iniVenc"></div>
`;

}

if(hoyT.length){

html+=`
<div class="subtituloInicio azul">
Para hoy · ${hoyT.length}
</div>
<div id="iniHoyT"></div>
`;

}

if(
!venc.length &&
!hoyT.length
){

html=
'<div class="vacio">Sin tareas urgentes.</div>';

}

$("tareasInicio").innerHTML=html;

const tTar=
$("tarjetaTareasInicio");

tTar.classList.toggle(
"inicioVacia",
!venc.length&&!hoyT.length
);

if(venc.length){

insertarTareas(
$("iniVenc"),
venc
);

}

if(hoyT.length){

insertarTareas(
$("iniHoyT"),
hoyT
);

}

renderEstaSemana();
renderProximamente();

}

function renderEstaSemana(){

let html="";
let cantidad=0;

const h=new Date();
h.setHours(12,0,0,0);

for(let i=0;i<7;i++){

const d=sumarDias(h,i);
const f=fechaLocal(d);

const ev=
eventosEnFechaTodos(f);

const ta=
tareas.filter(
t=>
!t.completada &&
t.fechaLimite===f
);

cantidad+=ev.length+ta.length;

if(
!ev.length &&
!ta.length
){
continue
}

const nom=
i===0
?"Hoy"
:cap(
new Intl.DateTimeFormat(
"es-ES",
{
weekday:"long",
day:"numeric",
month:"short"
}
)
.format(d)
.replace(".","")
);

html+=`

<div class="semanaInicioDia">

<div class="semanaInicioTitulo ${i===0?"hoy":""}">

${nom}

<button
class="irAgendaDia"
data-ir-dia="${f}">
Ver día
</button>

</div>

${ev.map(htmlEvento).join("")}

${ta.map(htmlTarea).join("")}

</div>

`;

}

const tarjeta=
$("tarjetaSemanaInicio");

tarjeta.classList.toggle(
"tarjetaSemanaVacia",
cantidad===0
);

$("estaSemana").innerHTML=
html||
'<div class="vacio">Nada previsto.</div>';

$("estaSemana")
.querySelectorAll("[data-ver-evento]")
.forEach(x=>{

x.onclick=()=>abrirFichaEvento(
x.dataset.verEvento,
x.dataset.aparicion
)

});

$("estaSemana")
.querySelectorAll("[data-ver-tarea]")
.forEach(x=>{

x.onclick=()=>
abrirFichaTarea(
x.dataset.verTarea
)

});

$("estaSemana")
.querySelectorAll("[data-completar]")
.forEach(b=>{

b.onclick=async e=>{

e.stopPropagation();

const t=tareas.find(
x=>x.id===b.dataset.completar
);

if(t){
await completarTarea(t)
}

}

});

$("estaSemana")
.querySelectorAll("[data-ir-dia]")
.forEach(b=>{

b.onclick=()=>{

fechaAgenda=
desdeFechaLocal(
b.dataset.irDia
);

vistaAgenda="dia";

cambiarPantalla("agenda");

}

});

}

function renderProximamente(){

const base=new Date();
base.setHours(12,0,0,0);

let items=[];

for(let i=7;i<=30;i++){

const d=sumarDias(base,i);
const f=fechaLocal(d);

eventosEnFechaTodos(f)
.forEach(e=>
items.push({
tipo:"evento",
fecha:f,
e
})
);

tareas
.filter(
t=>
!t.completada &&
t.fechaLimite===f
)
.forEach(t=>
items.push({
tipo:"tarea",
fecha:f,
t
})
);

}

items=items.slice(0,5);

$("proximamente").innerHTML=
items.length
?items.map(x=>

x.tipo==="evento"

?`
<div class="proximamenteItem">
<div class="proximamenteFecha">
${fechaBonita(x.fecha)}
</div>
${htmlEvento(x.e)}
</div>
`

:`
<div class="proximamenteItem">
<div class="proximamenteFecha">
${fechaBonita(x.fecha)}
</div>
${htmlTarea(x.t)}
</div>
`

).join("")

:'<div class="vacio">Nada más previsto en los próximos 30 días.</div>';

$("tarjetaProximamente").style.display=
items.length
?"block"
:"none";

$("proximamente")
.querySelectorAll("[data-ver-evento]")
.forEach(x=>{

x.onclick=()=>abrirFichaEvento(
x.dataset.verEvento,
x.dataset.aparicion
)

});

$("proximamente")
.querySelectorAll("[data-ver-tarea]")
.forEach(x=>{

x.onclick=()=>
abrirFichaTarea(
x.dataset.verTarea
)

});

$("proximamente")
.querySelectorAll("[data-completar]")
.forEach(b=>{

b.onclick=async e=>{

e.stopPropagation();

const t=tareas.find(
x=>x.id===b.dataset.completar
);

if(t){
await completarTarea(t)
}

}

});

}

function renderAgenda(){

$("vistaDia").style.display=
vistaAgenda==="dia"
?"block"
:"none";

$("vistaSemana").style.display=
vistaAgenda==="semana"
?"block"
:"none";

$("vistaMes").style.display=
vistaAgenda==="mes"
?"block"
:"none";

document
.querySelectorAll("[data-vista]")
.forEach(b=>
b.classList.toggle(
"activo",
b.dataset.vista===vistaAgenda
)
);

vistaAgenda==="dia"
?renderDia()
:vistaAgenda==="semana"
?renderSemana()
:renderMes();

}

function renderDia(){

const f=fechaLocal(fechaAgenda);

const l=eventosEnFecha(f);

$("tituloPeriodo").textContent=
fechaBonita(f);

$("contadorPeriodo").textContent=
`${l.length} ${l.length===1?"evento":"eventos"}`;

$("vistaDia").innerHTML=
'<div class="tarjeta"><div id="listaDia"></div></div>';

insertarEventos(
$("listaDia"),
l
);

}

function renderSemana(){

const l=
lunesDeSemana(fechaAgenda);

const fin=
sumarDias(l,6);

const dias=
Array.from(
{length:7},
(_,i)=>sumarDias(l,i)
);

$("tituloPeriodo").textContent=
tituloSemana(l,fin);

const nSem=
aparicionesEntre(l,fin).length;

$("contadorPeriodo").textContent=
`${nSem} ${nSem===1?"evento":"eventos"} esta semana`;

const franja=
dias.map(d=>{

const f=fechaLocal(d);

const ev=
eventosEnFecha(f);

const letra=
new Intl.DateTimeFormat(
"es-ES",
{weekday:"short"}
)
.format(d)
.replace(".","")[0]
.toUpperCase();

return `
<button
class="diaCompacto ${mismoDia(d,new Date())?"hoy":""}"
data-dia="${f}">

<span class="letraDia">
${letra}
</span>

<span class="numeroDiaCompacto">
${d.getDate()}
</span>

<span class="puntosSemana">

${ev.slice(0,3)
.map(e=>`
<span
class="puntoSemana"
style="background:${colorSimple(e.participantes||[])}">
</span>
`)
.join("")}

</span>
</button>
`

}).join("");

const resumen=
dias.map(d=>{

const f=fechaLocal(d);

const ev=
eventosEnFecha(f);

const nom=
cap(
new Intl.DateTimeFormat(
"es-ES",
{weekday:"long"}
)
.format(d)
);

const mes=
new Intl.DateTimeFormat(
"es-ES",
{month:"long"}
)
.format(d);

return `

<div class="bloqueDiaSemana ${ev.length?"":"sinEventos"} ${mismoDia(d,new Date())?"esHoy":""}">

<div
class="cabResumenDia"
data-dia="${f}">

<span class="fechaResumenDia">
${nom}, ${d.getDate()} de ${mes}
</span>

${ev.length
?`<span class="contadorDia">${ev.length}</span>`
:'<span class="sinEventosSemana">Sin eventos</span>'}

</div>

${ev.map(e=>`

<div
class="eventoSemanaLinea"
data-ver-evento="${e.id}"
data-aparicion="${e.fechaAparicion}">

<div
class="barraSemana"
style="background:${franjasPersonas(e.participantes||[])}">
</div>

<div class="horaSemana">
${escapar(textoHora(e))}
</div>

<div class="textoSemana">

<div class="tituloSemanaEvento">
${escapar(e.actividad)}
${distintivosEvento(e,f)}
</div>

<div class="personasSemana">
${escapar((e.participantes||[]).join(" · "))}
</div>

</div>
</div>

`).join("")}

</div>
`

}).join("");

$("vistaSemana").innerHTML=`

<div class="semanaCompacta">
<div class="franjaSemana">
${franja}
</div>
</div>

<div class="resumenSemana">
${resumen}
</div>

`;

$("vistaSemana")
.querySelectorAll("[data-dia]")
.forEach(x=>{

x.onclick=()=>{

fechaAgenda=
desdeFechaLocal(
x.dataset.dia
);

vistaAgenda="dia";

renderAgenda();

}

});

$("vistaSemana")
.querySelectorAll("[data-ver-evento]")
.forEach(x=>{

x.onclick=e=>{

e.stopPropagation();

abrirFichaEvento(
x.dataset.verEvento,
x.dataset.aparicion
);

}

});

}

function renderMes(){

const y=
fechaAgenda.getFullYear();

const m=
fechaAgenda.getMonth();

const prim=
new Date(y,m,1,12);

const dias=
new Date(y,m+1,0,12)
.getDate();

let huecos=
prim.getDay()-1;

if(huecos<0){
huecos=6
}

const total=
Math.ceil(
(huecos+dias)/7
)*7;

$("tituloPeriodo").textContent=
tituloMes(fechaAgenda);

const nMes=
aparicionesEntre(
prim,
new Date(y,m,dias,12)
).length;

$("contadorPeriodo").textContent=
`${nMes} ${nMes===1?"evento":"eventos"} este mes`;

let c=
'<div class="celdaVacia"></div>'
.repeat(huecos);

for(let n=1;n<=dias;n++){

const d=
new Date(y,m,n,12);

const f=
fechaLocal(d);

const ev=
eventosEnFecha(f);

c+=`

<div
class="celdaDia ${mismoDia(d,new Date())?"hoy":""} ${mismoDia(d,fechaAgenda)?"seleccionado":""}"
data-fecha="${f}">

<div class="numMes">
${n}
</div>

<div class="puntosMes">

${ev.slice(0,3)
.map(e=>`
<span
class="puntoMes"
style="background:${colorSimple(e.participantes||[])}">
</span>
`)
.join("")}

</div>

${ev[0]
?`
<div class="textoEventoMes">
${escapar(ev[0].actividad)}
</div>
`
:""}

${ev.length>1
?`
<div class="masMes">
+${ev.length-1}
</div>
`
:""}

</div>

`;

}

c+=
'<div class="celdaVacia"></div>'
.repeat(
total-huecos-dias
);

const f=
fechaLocal(fechaAgenda);

$("vistaMes").innerHTML=`

<div class="calendario">

<div class="cabCalendario">
<div>L</div>
<div>M</div>
<div>X</div>
<div>J</div>
<div>V</div>
<div>S</div>
<div>D</div>
</div>

<div class="rejillaMes">
${c}
</div>

</div>

<div class="tarjeta detalleMes">

<h2>
${fechaBonita(f)}
</h2>

<div id="eventosDiaMes"></div>

</div>

`;

insertarEventos(
$("eventosDiaMes"),
eventosEnFecha(f)
);

$("vistaMes")
.querySelectorAll("[data-fecha]")
.forEach(x=>{

let ultimo=0;

x.onclick=()=>{

const ahora=Date.now();

if(ahora-ultimo<350){

abrirEvento(
null,
null,
x.dataset.fecha
);

ultimo=0;

return

}

ultimo=ahora;

fechaAgenda=
desdeFechaLocal(
x.dataset.fecha
);

setTimeout(()=>{

if(
Date.now()-ultimo>=350
){

renderMes()

}

},360);

}

});

}

function renderTareas(){

let l=[...tareas];

if(filtroTareas!=="Todos"){

l=l.filter(
t=>
(t.responsables||[])
.includes(filtroTareas)
);

}

if(estadoTareas==="pendientes"){

l=l.filter(
t=>!t.completada
);

}

if(estadoTareas==="completadas"){

l=l.filter(
t=>t.completada
);

}

if(estadoTareas==="pendientes"){

const con=
l.filter(t=>t.fechaLimite);

const sin=
l.filter(t=>!t.fechaLimite);

$("listaTareas").innerHTML=`

<div id="tareasConFecha"></div>

${sin.length
?`
<div class="sinFechaBloque">
<div class="subtituloInicio">
Sin fecha · ${sin.length}
</div>
<div id="tareasSinFecha"></div>
</div>
`
:""}

`;

insertarTareas(
$("tareasConFecha"),
con
);

if(sin.length){

insertarTareas(
$("tareasSinFecha"),
sin
);

}

}else{

insertarTareas(
$("listaTareas"),
l
);

}

}

document
.querySelectorAll("[data-vista]")
.forEach(b=>{

b.onclick=()=>{

vistaAgenda=
b.dataset.vista;

renderAgenda();

}

});

$("anterior").onclick=()=>{

fechaAgenda=
vistaAgenda==="dia"
?sumarDias(fechaAgenda,-1)
:vistaAgenda==="semana"
?sumarDias(fechaAgenda,-7)
:new Date(
fechaAgenda.getFullYear(),
fechaAgenda.getMonth()-1,
1,
12
);

renderAgenda();

};

$("siguiente").onclick=()=>{

fechaAgenda=
vistaAgenda==="dia"
?sumarDias(fechaAgenda,1)
:vistaAgenda==="semana"
?sumarDias(fechaAgenda,7)
:new Date(
fechaAgenda.getFullYear(),
fechaAgenda.getMonth()+1,
1,
12
);

renderAgenda();

};

$("irHoy").onclick=()=>{

fechaAgenda=new Date();

renderAgenda();

};

function cambiarPantalla(p){

pantallaActual=p;

document
.querySelectorAll(".pantalla")
.forEach(x=>
x.classList.remove("activa")
);

document
.querySelectorAll(".navbtn")
.forEach(x=>
x.classList.toggle(
"activo",
x.dataset.pantalla===p
)
);

$(p).classList.add("activa");

if(p==="agenda"){
renderAgenda()
}

if(p==="tareas"){
renderTareas()
}

if(p==="inicio"){
renderInicio()
}

}

document
.querySelectorAll(".navbtn")
.forEach(b=>{

b.onclick=()=>
cambiarPantalla(
b.dataset.pantalla
)

});

document
.querySelectorAll("[data-estado]")
.forEach(b=>{

b.onclick=()=>{

estadoTareas=
b.dataset.estado;

document
.querySelectorAll("[data-estado]")
.forEach(x=>
x.classList.toggle(
"activo",
x===b
)
);

renderTareas();

}

});

$("fab").onclick=()=>{

if(pantallaActual==="tareas"){

abrirTarea();

}else if(pantallaActual==="agenda"){

abrirEvento();

}else{

$("modalRapido")
.classList.add("visible");

}

};

$("rapidoEvento").onclick=()=>{

$("modalRapido")
.classList.remove("visible");

abrirEvento();

};

$("rapidoTarea").onclick=()=>{

$("modalRapido")
.classList.remove("visible");

abrirTarea();

};

$("cerrarRapido").onclick=()=>{

$("modalRapido")
.classList.remove("visible");

};

[
"modalRapido",
"modalEvento",
"modalFicha",
"modalSerie",
"modalTarea",
"modalFichaTarea"
].forEach(id=>{

$(id).addEventListener(
"click",
e=>{

if(e.target===$(id)){

if(id==="modalSerie"){
accionSerie=null
}

$(id).classList.remove("visible");

}

}
);

});

document.addEventListener(
"keydown",
e=>{

if(e.key!=="Escape")return;

document
.querySelectorAll(".modal-fondo.visible")
.forEach(m=>
m.classList.remove("visible")
);

accionSerie=null;

}
);

</script>
</body>
</html>
