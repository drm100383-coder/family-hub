<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Family Hub">

  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="./manifest.json">

  <title>Family Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f5f7fb;
      color: #172033;

      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .contenedor {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 32px 20px 50px;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 40px auto 20px;
      border-radius: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #6d28d9
        );

      color: white;
      font-size: 24px;
      font-weight: 900;

      box-shadow:
        0 12px 30px
        rgba(37, 99, 235, 0.25);
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.1;
    }

    .subtitulo {
      margin-top: 16px;
      color: #667085;
      font-size: 17px;
    }

    .tarjeta {
      margin-top: 35px;
      padding: 24px 20px;

      background: white;
      border-radius: 20px;

      box-shadow:
        0 7px 24px
        rgba(15, 23, 42, 0.07);

      text-align: left;
    }

    .tarjeta h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .tarjeta p {
      margin: 0;
      color: #667085;
      font-size: 15px;
      line-height: 1.5;
    }

    .campo {
      margin-top: 16px;
    }

    .campo label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 800;
      color: #344054;
    }

    .campo input {
      width: 100%;
      padding: 14px 15px;

      border: 1px solid #d0d5dd;
      border-radius: 12px;

      background: white;
      color: #172033;

      font-size: 16px;
      outline: none;
    }

    .boton {
      width: 100%;

      border: 0;
      border-radius: 14px;

      margin-top: 20px;
      padding: 15px 18px;

      background: #2563eb;
      color: white;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;
    }

    .boton:disabled {
      opacity: 0.6;
    }

    .boton-secundario {
      width: 100%;

      margin-top: 12px;
      padding: 12px;

      border: 1px solid #d0d5dd;
      border-radius: 12px;

      background: white;
      color: #344054;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;
    }

    .estado {
      display: none;

      margin-top: 18px;
      padding: 16px;

      border-radius: 14px;
      line-height: 1.45;
    }

    .estado.cargando {
      display: block;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .estado.correcto {
      display: block;
      background: #ecfdf3;
      color: #166534;
    }

    .estado.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
    }

    #pantallaLogin,
    #pantallaApp {
      display: none;
    }

    .usuario {
      margin-top: 12px;
      color: #667085;
      font-size: 13px;
      text-align: center;
    }

    .familia {
      margin-top: 20px;
      display: none;
    }

    .familia.visible {
      display: block;
    }

    .miembro {
      display: flex;
      align-items: center;
      gap: 12px;

      padding: 11px 0;

      border-bottom:
        1px solid #eaecf0;
    }

    .miembro:last-child {
      border-bottom: 0;
    }

    .color {
      width: 22px;
      height: 22px;

      flex: 0 0 22px;

      border-radius: 50%;

      border:
        1px solid rgba(0, 0, 0, 0.15);
    }

    .nombre {
      font-weight: 700;
    }

    @media (max-width: 500px) {
      .contenedor {
        padding: 22px 18px 40px;
      }

      .logo {
        margin-top: 38px;
      }

      h1 {
        font-size: 36px;
      }

      .subtitulo {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <div class="logo">
      D&amp;N
    </div>

    <h1>Family Hub</h1>

    <p class="subtitulo">
      Agenda y organización familiar
    </p>


    <section
      id="pantallaLogin"
      class="tarjeta"
    >

      <h2>Acceso familiar</h2>

      <p>
        Inicia sesión para acceder a Family Hub.
      </p>


      <div class="campo">

        <label for="email">
          Correo electrónico
        </label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          placeholder="tu@email.com"
        >

      </div>


      <div class="campo">

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Contraseña"
        >

      </div>


      <button
        id="botonLogin"
        class="boton"
      >
        Entrar
      </button>


      <div
        id="estadoLogin"
        class="estado"
      ></div>

    </section>



    <section
      id="pantallaApp"
      class="tarjeta"
    >

      <h2>Familia</h2>

      <p>
        Vamos a crear la estructura familiar
        inicial de Family Hub.
      </p>


      <div
        id="usuarioActivo"
        class="usuario"
      ></div>


      <button
        id="botonFamilia"
        class="boton"
      >
        Cargar familia
      </button>


      <button
        id="botonSalir"
        class="boton-secundario"
      >
        Cerrar sesión
      </button>


      <div
        id="estado"
        class="estado"
      ></div>


      <div
        id="listaFamilia"
        class="familia"
      ></div>

    </section>

  </main>



  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    import {
      getFirestore,
      doc,
      setDoc,
      collection,
      getDocs,
      writeBatch
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



    const firebaseConfig = {

      apiKey:
        "AIzaSyAUFrFko2y5TYmC2XSXYfnJXwQ-Gv0GgZw",

      authDomain:
        "family-hub-9fa54.firebaseapp.com",

      projectId:
        "family-hub-9fa54",

      storageBucket:
        "family-hub-9fa54.firebasestorage.app",

      messagingSenderId:
        "517316541547",

      appId:
        "1:517316541547:web:03db1291d5d1f41f68c52e"
    };


    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);



    try {

      await setPersistence(
        auth,
        browserLocalPersistence
      );

    } catch (error) {

      console.error(error);
    }



    const pantallaLogin =
      document.getElementById(
        "pantallaLogin"
      );


    const pantallaApp =
      document.getElementById(
        "pantallaApp"
      );


    const emailInput =
      document.getElementById(
        "email"
      );


    const passwordInput =
      document.getElementById(
        "password"
      );


    const botonLogin =
      document.getElementById(
        "botonLogin"
      );


    const botonSalir =
      document.getElementById(
        "botonSalir"
      );


    const botonFamilia =
      document.getElementById(
        "botonFamilia"
      );


    const estadoLogin =
      document.getElementById(
        "estadoLogin"
      );


    const estado =
      document.getElementById(
        "estado"
      );


    const usuarioActivo =
      document.getElementById(
        "usuarioActivo"
      );


    const listaFamilia =
      document.getElementById(
        "listaFamilia"
      );



    /*
     * Datos procedentes de la hoja
     * Familia de AGENDA RIQUELME CARDENAL.
     */

    const familiaInicial = [

      {
        id: "daniel",
        nombre: "Daniel",
        activo: true,
        color: "#E53935",
        orden: 1
      },

      {
        id: "nuria",
        nombre: "Nuria",
        activo: true,
        color: "#00ACC1",
        orden: 2
      },

      {
        id: "julio",
        nombre: "Julio",
        activo: true,
        color: "#FBC02D",
        orden: 3
      },

      {
        id: "ezequiel",
        nombre: "Ezequiel",
        activo: true,
        color: "#1E88E5",
        orden: 4
      },

      {
        id: "isabel",
        nombre: "Isabel",
        activo: true,
        color: "#EC407A",
        orden: 5
      },

      {
        id: "gabriel",
        nombre: "Gabriel",
        activo: true,
        color: "#FFFFFF",
        orden: 6
      },

      {
        id: "familia",
        nombre: "Familia",
        activo: true,
        color: "#43A047",
        orden: 7
      }

    ];



    onAuthStateChanged(
      auth,
      async usuario => {

        if (usuario) {

          pantallaLogin.style.display =
            "none";


          pantallaApp.style.display =
            "block";


          usuarioActivo.textContent =
            usuario.email;


          passwordInput.value =
            "";


          await leerFamilia();


        } else {

          pantallaApp.style.display =
            "none";


          pantallaLogin.style.display =
            "block";


          listaFamilia.className =
            "familia";
        }
      }
    );



    botonLogin.addEventListener(
      "click",
      iniciarSesion
    );


    passwordInput.addEventListener(
      "keydown",
      evento => {

        if (evento.key === "Enter") {
          iniciarSesion();
        }
      }
    );


    async function iniciarSesion() {

      const email =
        emailInput.value.trim();


      const password =
        passwordInput.value;


      if (!email || !password) {

        estadoLogin.className =
          "estado error";


        estadoLogin.textContent =
          "Introduce el correo y la contraseña.";

        return;
      }


      botonLogin.disabled = true;

      botonLogin.textContent =
        "Entrando...";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        estadoLogin.className =
          "estado";


      } catch (error) {

        console.error(error);


        estadoLogin.className =
          "estado error";


        estadoLogin.textContent =
          "Correo o contraseña incorrectos.";


      } finally {

        botonLogin.disabled = false;

        botonLogin.textContent =
          "Entrar";
      }
    }



    botonSalir.addEventListener(
      "click",
      async () => {

        await signOut(auth);
      }
    );



    botonFamilia.addEventListener(
      "click",
      cargarFamilia
    );



    async function cargarFamilia() {

      if (!auth.currentUser) {

        estado.className =
          "estado error";


        estado.textContent =
          "No hay una sesión iniciada.";

        return;
      }


      botonFamilia.disabled =
        true;


      botonFamilia.textContent =
        "Guardando...";


      estado.className =
        "estado cargando";


      estado.textContent =
        "Creando la familia en Firestore...";


      try {

        /*
         * Batch: los siete documentos se guardan
         * juntos. Si hubiera un fallo, no queda
         * una migración a medias.
         */

        const batch =
          writeBatch(db);


        familiaInicial.forEach(
          persona => {

            const referencia =
              doc(
                db,
                "familia",
                persona.id
              );


            batch.set(
              referencia,
              {
                nombre: persona.nombre,
                activo: persona.activo,
                color: persona.color,
                orden: persona.orden
              }
            );
          }
        );


        await batch.commit();


        estado.className =
          "estado correcto";


        estado.textContent =
          "Familia guardada correctamente en Firestore.";


        await leerFamilia();


      } catch (error) {

        console.error(error);


        estado.className =
          "estado error";


        estado.textContent =
          "No se pudo guardar la familia: " +
          error.message;


      } finally {

        botonFamilia.disabled =
          false;


        botonFamilia.textContent =
          "Cargar familia";
      }
    }



    async function leerFamilia() {

      try {

        const consulta =
          await getDocs(
            collection(
              db,
              "familia"
            )
          );


        const personas = [];


        consulta.forEach(
          documento => {

            personas.push({
              id: documento.id,
              ...documento.data()
            });
          }
        );


        personas.sort(
          (a, b) =>
            (a.orden || 999) -
            (b.orden || 999)
        );


        mostrarFamilia(
          personas
        );


        if (personas.length === 7) {

          botonFamilia.textContent =
            "Familia cargada";

        }

      } catch (error) {

        console.error(error);
      }
    }



    function mostrarFamilia(personas) {

      listaFamilia.innerHTML =
        "";


      if (!personas.length) {

        listaFamilia.className =
          "familia";

        return;
      }


      personas.forEach(
        persona => {

          const fila =
            document.createElement(
              "div"
            );


          fila.className =
            "miembro";


          const color =
            document.createElement(
              "span"
            );


          color.className =
            "color";


          color.style.background =
            persona.color;


          const nombre =
            document.createElement(
              "span"
            );


          nombre.className =
            "nombre";


          nombre.textContent =
            persona.nombre;


          fila.appendChild(
            color
          );


          fila.appendChild(
            nombre
          );


          listaFamilia.appendChild(
            fila
          );
        }
      );


      listaFamilia.className =
        "familia visible";
    }

  </script>

</body>
</html>
