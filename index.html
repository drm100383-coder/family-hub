<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family Hub">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="./manifest.json">
<title>Family Hub</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f5f7fb;color:#172033;
  padding-top:env(safe-area-inset-top);
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

header{
  position:sticky;top:0;z-index:20;
  background:rgba(245,247,251,.96);
  backdrop-filter:blur(12px);
  padding:14px 18px 10px;
  border-bottom:1px solid #e5e7eb;
}
.cabecera{
  max-width:700px;margin:auto;
  display:flex;align-items:center;justify-content:space-between;
}
.marca{display:flex;align-items:center;gap:10px}
.logo{
  width:42px;height:42px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#2563eb,#6d28d9);
  color:white;font-weight:900;font-size:14px;
}
.titulo{font-size:20px;font-weight:900}
.sub{font-size:11px;color:#667085;margin-top:2px}
.salir{
  border:0;background:#e9eef8;color:#344054;
  border-radius:10px;padding:9px 11px;font-size:12px;font-weight:800;
}

main{max-width:700px;margin:auto;padding:18px}

.pantalla{display:none}
.pantalla.activa{display:block}

.bienvenida{margin-bottom:18px}
.bienvenida h1{margin:0;font-size:28px}
.bienvenida p{margin:6px 0 0;color:#667085}

.resumen{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:9px;margin-bottom:20px;
}
.dato{
  background:white;border-radius:16px;padding:16px 8px;
  text-align:center;box-shadow:0 4px 16px rgba(15,23,42,.05);
}
.numero{display:block;font-size:25px;font-weight:900}
.etiqueta{
  display:block;margin-top:3px;color:#667085;
  font-size:10px;font-weight:800;text-transform:uppercase;
}

.tarjeta{
  background:white;border-radius:18px;padding:18px;
  margin-bottom:14px;box-shadow:0 4px 16px rgba(15,23,42,.05);
}
.tarjeta h2{font-size:18px;margin:0 0 14px}

.evento{
  padding:13px 0;border-bottom:1px solid #eaecf0;
  display:flex;gap:11px;align-items:flex-start;
}
.evento:last-child{border-bottom:0}
.barra{
  width:5px;align-self:stretch;min-height:46px;
  border-radius:6px;background:#2563eb;
}
.evento-contenido{flex:1;min-width:0}
.evento-titulo{font-weight:800}
.evento-meta{font-size:13px;color:#667085;margin-top:4px}
.evento-personas{font-size:12px;color:#667085;margin-top:5px}
.borrar{
  border:0;background:#fef2f2;color:#b42318;
  border-radius:9px;padding:7px 9px;font-weight:800;
}

.vacio{
  color:#98a2b3;text-align:center;padding:22px 5px;
  font-size:14px;
}

.filtros{
  display:flex;gap:7px;overflow:auto;
  padding-bottom:5px;margin-bottom:14px;
}
.filtro{
  white-space:nowrap;border:1px solid #d0d5dd;
  background:white;border-radius:999px;padding:8px 12px;
  font-size:12px;font-weight:800;color:#475467;
}
.filtro.activo{background:#172033;color:white;border-color:#172033}

.fecha-agenda{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.fecha-agenda h1{font-size:25px;margin:0}
.fecha-agenda input{
  border:1px solid #d0d5dd;border-radius:10px;
  padding:8px;background:white;
}

.fab{
  position:fixed;right:20px;
  bottom:calc(88px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;
  border:0;background:#2563eb;color:white;
  font-size:31px;box-shadow:0 10px 25px rgba(37,99,235,.35);
  z-index:30;
}

nav{
  position:fixed;bottom:0;left:0;right:0;z-index:25;
  height:calc(68px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:white;border-top:1px solid #e5e7eb;
  display:flex;
}
.navbtn{
  flex:1;border:0;background:white;color:#667085;
  font-size:12px;font-weight:800;
}
.navbtn.activo{color:#2563eb}

.modal-fondo{
  display:none;position:fixed;inset:0;z-index:50;
  background:rgba(15,23,42,.45);
  padding:20px;align-items:flex-end;justify-content:center;
}
.modal-fondo.visible{display:flex}
.modal{
  background:white;width:100%;max-width:600px;
  max-height:90vh;overflow:auto;border-radius:24px 24px 16px 16px;
  padding:22px;
}
.modal h2{margin:0 0 18px}
.campo{margin-bottom:14px}
.campo label{
  display:block;font-size:12px;font-weight:800;
  margin-bottom:6px;color:#344054;
}
.campo input,.campo select,.campo textarea{
  width:100%;border:1px solid #d0d5dd;border-radius:11px;
  padding:12px;background:white;color:#172033;
}
.campo textarea{min-height:75px;resize:vertical}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{
  border:1px solid #d0d5dd;border-radius:999px;
  padding:8px 11px;font-size:12px;
}
.check input{margin-right:5px}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.cancelar,.guardar{
  border:0;border-radius:12px;padding:13px;font-weight:900;
}
.cancelar{background:#eef2f6;color:#344054}
.guardar{background:#2563eb;color:white}

.login{
  min-height:75vh;display:flex;align-items:center;justify-content:center;
}
.loginbox{
  width:100%;max-width:430px;background:white;
  padding:24px;border-radius:22px;
  box-shadow:0 8px 28px rgba(15,23,42,.08);
}
.loginbox h1{margin-top:0}
.loginbox input{
  width:100%;padding:14px;margin-top:12px;
  border:1px solid #d0d5dd;border-radius:12px;
}
.loginbox button{
  width:100%;margin-top:15px;padding:14px;border:0;
  border-radius:12px;background:#2563eb;color:white;font-weight:900;
}
.error{color:#b42318;margin-top:12px;font-size:13px}

@media(max-width:430px){
  main{padding:15px}
  .bienvenida h1{font-size:25px}
  .tarjeta{padding:16px}
}
</style>
</head>

<body>

<div id="login" class="login" style="display:none">
  <div class="loginbox">
    <h1>Family Hub</h1>
    <p style="color:#667085">Agenda y organización familiar</p>
    <input id="email" type="email" placeholder="Correo electrónico" autocomplete="username">
    <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="entrar">Entrar</button>
    <div id="errorLogin" class="error"></div>
  </div>
</div>

<div id="app" style="display:none">

<header>
  <div class="cabecera">
    <div class="marca">
      <div class="logo">D&amp;N</div>
      <div>
        <div class="titulo">Family Hub</div>
        <div id="usuario" class="sub"></div>
      </div>
    </div>
    <button id="salir" class="salir">Salir</button>
  </div>
</header>

<main>

<section id="inicio" class="pantalla activa">
  <div class="bienvenida">
    <h1>Inicio</h1>
    <p id="fechaHoy"></p>
  </div>

  <div class="resumen">
    <div class="dato">
      <span id="nHoy" class="numero">0</span>
      <span class="etiqueta">Hoy</span>
    </div>
    <div class="dato">
      <span id="nProximos" class="numero">0</span>
      <span class="etiqueta">Próximos</span>
    </div>
    <div class="dato">
      <span id="nFamilia" class="numero">0</span>
      <span class="etiqueta">Familia</span>
    </div>
  </div>

  <div class="tarjeta">
    <h2>Hoy</h2>
    <div id="eventosHoy"></div>
  </div>

  <div class="tarjeta">
    <h2>Próximos eventos</h2>
    <div id="eventosProximos"></div>
  </div>
</section>


<section id="agenda" class="pantalla">

  <div class="fecha-agenda">
    <h1>Agenda</h1>
    <input id="fechaAgenda" type="date">
  </div>

  <div id="filtros" class="filtros"></div>

  <div class="tarjeta">
    <h2 id="tituloDia"></h2>
    <div id="listaAgenda"></div>
  </div>

</section>

</main>

<button id="fab" class="fab">+</button>

<nav>
  <button class="navbtn activo" data-pantalla="inicio">Inicio</button>
  <button class="navbtn" data-pantalla="agenda">Agenda</button>
  <button class="navbtn" id="navTareas">Tareas</button>
</nav>

</div>


<div id="modalEvento" class="modal-fondo">
  <div class="modal">

    <h2>Nuevo evento</h2>

    <div class="campo">
      <label>Actividad</label>
      <input id="actividad" type="text" placeholder="¿Qué hay que hacer?">
    </div>

    <div class="campo">
      <label>Fecha</label>
      <input id="fechaEvento" type="date">
    </div>

    <div class="campo">
      <label>
        <input id="todoDia" type="checkbox">
        Todo el día
      </label>
    </div>

    <div id="horas" class="dos">
      <div class="campo">
        <label>Hora inicio</label>
        <input id="horaInicio" type="time">
      </div>

      <div class="campo">
        <label>Hora fin</label>
        <input id="horaFin" type="time">
      </div>
    </div>

    <div class="campo">
      <label>Participantes</label>
      <div id="participantes" class="checks"></div>
    </div>

    <div class="campo">
      <label>Lugar</label>
      <input id="lugar" type="text">
    </div>

    <div class="dos">
      <div class="campo">
        <label>Categoría</label>
        <select id="categoria">
          <option>Familia</option>
          <option>Colegio</option>
          <option>Trabajo</option>
          <option>Salud</option>
          <option>Ocio</option>
          <option>Otro</option>
        </select>
      </div>

      <div class="campo">
        <label>Prioridad</label>
        <select id="prioridad">
          <option>Normal</option>
          <option>Alta</option>
          <option>Baja</option>
        </select>
      </div>
    </div>

    <div class="campo">
      <label>Repetición</label>
      <select id="repeticion">
        <option value="">No repetir</option>
        <option>Semanal</option>
        <option>Mensual</option>
        <option>Anual</option>
      </select>
    </div>

    <div class="campo">
      <label>Notas</label>
      <textarea id="notas"></textarea>
    </div>

    <div class="acciones">
      <button id="cancelarEvento" class="cancelar">Cancelar</button>
      <button id="guardarEvento" class="guardar">Guardar</button>
    </div>

  </div>
</div>


<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  deleteDoc,
  doc,
  serverTimestamp,
  onSnapshot
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig={
  apiKey:"AIzaSyAUFrFko2y5TYmC2XSXYfnJXwQ-Gv0GgZw",
  authDomain:"family-hub-9fa54.firebaseapp.com",
  projectId:"family-hub-9fa54",
  storageBucket:"family-hub-9fa54.firebasestorage.app",
  messagingSenderId:"517316541547",
  appId:"1:517316541547:web:03db1291d5d1f41f68c52e"
};

const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
const db=getFirestore(firebaseApp);

await setPersistence(auth,browserLocalPersistence);

let familia=[];
let eventos=[];
let filtroPersona="Todos";
let unsubscribeEventos=null;

const $=id=>document.getElementById(id);

function fechaLocal(d=new Date()){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const dia=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dia}`;
}

function escapar(t=""){
  const d=document.createElement("div");
  d.textContent=t;
  return d.innerHTML;
}

function fechaBonita(fecha){
  if(!fecha)return "";
  const [y,m,d]=fecha.split("-").map(Number);
  return new Intl.DateTimeFormat(
    "es-ES",
    {weekday:"long",day:"numeric",month:"long"}
  ).format(new Date(y,m-1,d));
}

$("fechaHoy").textContent=
  new Intl.DateTimeFormat(
    "es-ES",
    {weekday:"long",day:"numeric",month:"long",year:"numeric"}
  ).format(new Date());

$("fechaAgenda").value=fechaLocal();


$("entrar").onclick=async()=>{
  $("errorLogin").textContent="";
  try{
    await signInWithEmailAndPassword(
      auth,
      $("email").value.trim(),
      $("password").value
    );
  }catch(e){
    $("errorLogin").textContent="Correo o contraseña incorrectos.";
  }
};

$("password").addEventListener("keydown",e=>{
  if(e.key==="Enter")$("entrar").click();
});

$("salir").onclick=()=>signOut(auth);


onAuthStateChanged(auth,async user=>{
  if(!user){
    $("app").style.display="none";
    $("login").style.display="flex";
    if(unsubscribeEventos)unsubscribeEventos();
    return;
  }

  $("login").style.display="none";
  $("app").style.display="block";
  $("usuario").textContent=user.email;

  await cargarFamilia();
  escucharEventos();
});


async function cargarFamilia(){
  const snap=await getDocs(collection(db,"familia"));

  familia=snap.docs.map(d=>({
    id:d.id,
    ...d.data()
  })).sort((a,b)=>(a.orden||99)-(b.orden||99));

  $("nFamilia").textContent=
    familia.filter(p=>p.id!=="familia").length;

  crearParticipantes();
  crearFiltros();
}


function escucharEventos(){
  if(unsubscribeEventos)unsubscribeEventos();

  unsubscribeEventos=onSnapshot(
    collection(db,"eventos"),
    snap=>{
      eventos=snap.docs.map(d=>({
        id:d.id,
        ...d.data()
      }));

      eventos.sort((a,b)=>{
        const A=(a.fecha||"")+" "+(a.horaInicio||"");
        const B=(b.fecha||"")+" "+(b.horaInicio||"");
        return A.localeCompare(B);
      });

      renderTodo();
    }
  );
}


function crearParticipantes(){
  $("participantes").innerHTML="";

  familia
    .filter(p=>p.activo)
    .forEach(p=>{
      const label=document.createElement("label");
      label.className="check";
      label.innerHTML=
        `<input type="checkbox" value="${escapar(p.nombre)}">
         ${escapar(p.nombre)}`;
      $("participantes").appendChild(label);
    });
}


function crearFiltros(){
  $("filtros").innerHTML="";

  ["Todos",...familia.filter(p=>p.id!=="familia").map(p=>p.nombre)]
    .forEach(nombre=>{
      const b=document.createElement("button");
      b.className="filtro"+(nombre===filtroPersona?" activo":"");
      b.textContent=nombre;
      b.onclick=()=>{
        filtroPersona=nombre;
        crearFiltros();
        renderAgenda();
      };
      $("filtros").appendChild(b);
    });
}


function colorEvento(e){
  const nombres=e.participantes||[];

  if(nombres.length===1){
    const p=familia.find(x=>x.nombre===nombres[0]);
    return p?.color||"#2563eb";
  }

  if(nombres.length>1){
    const colores=nombres
      .map(n=>familia.find(x=>x.nombre===n)?.color)
      .filter(Boolean);

    if(colores.length>1){
      return `linear-gradient(${colores.join(",")})`;
    }

    if(colores.length===1)return colores[0];
  }

  return "#43A047";
}


function htmlEvento(e){
  const hora=e.todoDia
    ?"Todo el día"
    :[e.horaInicio,e.horaFin].filter(Boolean).join("–");

  return `
    <div class="evento">
      <div class="barra" style="background:${colorEvento(e)}"></div>
      <div class="evento-contenido">
        <div class="evento-titulo">${escapar(e.actividad||"Sin título")}</div>
        <div class="evento-meta">
          ${escapar(hora)}
          ${e.lugar?" · "+escapar(e.lugar):""}
        </div>
        <div class="evento-personas">
          ${escapar((e.participantes||[]).join(" · "))}
        </div>
      </div>
      <button class="borrar" data-borrar="${e.id}">×</button>
    </div>`;
}


function insertarEventos(elemento,lista){
  if(!lista.length){
    elemento.innerHTML='<div class="vacio">No hay eventos.</div>';
    return;
  }

  elemento.innerHTML=lista.map(htmlEvento).join("");

  elemento.querySelectorAll("[data-borrar]").forEach(b=>{
    b.onclick=async()=>{
      if(confirm("¿Eliminar este evento?")){
        await deleteDoc(doc(db,"eventos",b.dataset.borrar));
      }
    };
  });
}


function renderTodo(){
  renderInicio();
  renderAgenda();
}


function renderInicio(){
  const hoy=fechaLocal();

  const deHoy=eventos.filter(e=>e.fecha===hoy);

  const proximos=eventos
    .filter(e=>e.fecha>hoy)
    .slice(0,5);

  $("nHoy").textContent=deHoy.length;
  $("nProximos").textContent=eventos.filter(e=>e.fecha>hoy).length;

  insertarEventos($("eventosHoy"),deHoy);
  insertarEventos($("eventosProximos"),proximos);
}


function renderAgenda(){
  const fecha=$("fechaAgenda").value;

  $("tituloDia").textContent=
    fechaBonita(fecha);

  let lista=eventos.filter(e=>e.fecha===fecha);

  if(filtroPersona!=="Todos"){
    lista=lista.filter(
      e=>(e.participantes||[]).includes(filtroPersona)
    );
  }

  insertarEventos($("listaAgenda"),lista);
}


$("fechaAgenda").onchange=renderAgenda;


document.querySelectorAll(".navbtn[data-pantalla]").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".pantalla").forEach(p=>p.classList.remove("activa"));
    document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("activo"));

    $(b.dataset.pantalla).classList.add("activa");
    b.classList.add("activo");
  };
});


$("navTareas").onclick=()=>{
  alert("Tareas será el siguiente módulo que incorporaremos.");
};


$("fab").onclick=()=>{
  $("fechaEvento").value=$("fechaAgenda").value||fechaLocal();
  $("actividad").value="";
  $("horaInicio").value="";
  $("horaFin").value="";
  $("todoDia").checked=false;
  $("lugar").value="";
  $("notas").value="";
  $("categoria").value="Familia";
  $("prioridad").value="Normal";
  $("repeticion").value="";

  document
    .querySelectorAll("#participantes input")
    .forEach(c=>c.checked=false);

  $("horas").style.display="grid";
  $("modalEvento").classList.add("visible");
};


$("cancelarEvento").onclick=()=>{
  $("modalEvento").classList.remove("visible");
};


$("todoDia").onchange=()=>{
  $("horas").style.display=
    $("todoDia").checked?"none":"grid";
};


$("guardarEvento").onclick=async()=>{
  const actividad=$("actividad").value.trim();
  const fecha=$("fechaEvento").value;

  if(!actividad||!fecha){
    alert("Indica la actividad y la fecha.");
    return;
  }

  const participantes=[
    ...document.querySelectorAll("#participantes input:checked")
  ].map(c=>c.value);

  $("guardarEvento").disabled=true;
  $("guardarEvento").textContent="Guardando...";

  try{
    await addDoc(collection(db,"eventos"),{
      fecha,
      horaInicio:$("todoDia").checked?"":$("horaInicio").value,
      horaFin:$("todoDia").checked?"":$("horaFin").value,
      todoDia:$("todoDia").checked,
      participantes,
      actividad,
      lugar:$("lugar").value.trim(),
      notas:$("notas").value.trim(),
      repeticion:$("repeticion").value,
      categoria:$("categoria").value,
      prioridad:$("prioridad").value,
      recordatorio:"",
      creada:serverTimestamp(),
      creadoPor:auth.currentUser?.email||""
    });

    $("modalEvento").classList.remove("visible");

  }catch(e){
    alert("No se pudo guardar el evento.");
    console.error(e);
  }finally{
    $("guardarEvento").disabled=false;
    $("guardarEvento").textContent="Guardar";
  }
};

</script>
</body>
</html>
