<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Family Hub">

  <meta name="theme-color" content="#2563eb">

  <link rel="manifest" href="./manifest.json">

  <title>Family Hub</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f5f7fb;
      color: #172033;

      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .contenedor {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 32px 20px 50px;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 40px auto 20px;
      border-radius: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #6d28d9
        );

      color: white;
      font-size: 24px;
      font-weight: 900;

      box-shadow:
        0 12px 30px
        rgba(37, 99, 235, 0.25);
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.1;
    }

    .subtitulo {
      margin-top: 16px;
      color: #667085;
      font-size: 17px;
    }

    .tarjeta {
      margin-top: 35px;
      padding: 24px 20px;

      background: white;
      border-radius: 20px;

      box-shadow:
        0 7px 24px
        rgba(15, 23, 42, 0.07);

      text-align: left;
    }

    .tarjeta h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .tarjeta p {
      margin: 0;
      color: #667085;
      font-size: 15px;
      line-height: 1.5;
    }

    .campo {
      margin-top: 16px;
    }

    .campo label {
      display: block;
      margin-bottom: 7px;

      font-size: 13px;
      font-weight: 800;
      color: #344054;
    }

    .campo input {
      width: 100%;
      padding: 14px 15px;

      border: 1px solid #d0d5dd;
      border-radius: 12px;

      background: white;
      color: #172033;

      font-size: 16px;
      outline: none;
    }

    .campo input:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, 0.10);
    }

    .boton {
      width: 100%;

      border: 0;
      border-radius: 14px;

      margin-top: 20px;
      padding: 15px 18px;

      background: #2563eb;
      color: white;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;
    }

    .boton:disabled {
      opacity: 0.6;
    }

    .boton-secundario {
      width: 100%;

      margin-top: 12px;
      padding: 12px;

      border: 1px solid #d0d5dd;
      border-radius: 12px;

      background: white;
      color: #344054;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;
    }

    .estado {
      display: none;

      margin-top: 18px;
      padding: 16px;

      border-radius: 14px;
      line-height: 1.45;
    }

    .estado.cargando {
      display: block;

      background: #eff6ff;
      color: #1d4ed8;
    }

    .estado.correcto {
      display: block;

      background: #ecfdf3;
      color: #166534;
    }

    .estado.error {
      display: block;

      background: #fef2f2;
      color: #991b1b;
    }

    #pantallaLogin,
    #pantallaApp {
      display: none;
    }

    .usuario {
      margin-top: 12px;

      color: #667085;

      font-size: 13px;
      text-align: center;
    }

    .detalle {
      margin-top: 16px;
      padding: 12px;

      border-radius: 12px;

      background: #f8fafc;
      color: #667085;

      font-size: 13px;
      text-align: center;
      line-height: 1.5;
    }

    @media (max-width: 500px) {

      .contenedor {
        padding: 22px 18px 40px;
      }

      .logo {
        margin-top: 38px;
      }

      h1 {
        font-size: 36px;
      }

      .subtitulo {
        font-size: 18px;
      }
    }

  </style>
</head>


<body>

  <main class="contenedor">

    <div class="logo">
      D&amp;N
    </div>

    <h1>
      Family Hub
    </h1>

    <p class="subtitulo">
      Agenda y organización familiar
    </p>


    <!-- LOGIN -->

    <section
      id="pantallaLogin"
      class="tarjeta"
    >

      <h2>
        Acceso familiar
      </h2>

      <p>
        Inicia sesión para acceder a Family Hub.
      </p>


      <div class="campo">

        <label for="email">
          Correo electrónico
        </label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          placeholder="tu@email.com"
        >

      </div>


      <div class="campo">

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Contraseña"
        >

      </div>


      <button
        id="botonLogin"
        class="boton"
      >
        Entrar
      </button>


      <div
        id="estadoLogin"
        class="estado"
      ></div>

    </section>



    <!-- APP -->

    <section
      id="pantallaApp"
      class="tarjeta"
    >

      <h2>
        Family Hub conectado
      </h2>

      <p>
        Acceso familiar autorizado.
      </p>


      <div
        id="usuarioActivo"
        class="usuario"
      ></div>


      <button
        id="botonPrueba"
        class="boton"
      >
        Probar Firestore
      </button>


      <button
        id="botonSalir"
        class="boton-secundario"
      >
        Cerrar sesión
      </button>


      <div
        id="estado"
        class="estado"
      ></div>


      <div class="detalle">
        Esta prueba comprobará que Family Hub
        puede guardar y leer información de
        vuestra nueva base de datos privada.
      </div>

    </section>

  </main>



  <script type="module">

    /* ==========================================
       FIREBASE
    =========================================== */

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



    const firebaseConfig = {

      apiKey:
        "AIzaSyAUFrFko2y5TYmC2XSXYfnJXwQ-Gv0GgZw",

      authDomain:
        "family-hub-9fa54.firebaseapp.com",

      projectId:
        "family-hub-9fa54",

      storageBucket:
        "family-hub-9fa54.firebasestorage.app",

      messagingSenderId:
        "517316541547",

      appId:
        "1:517316541547:web:03db1291d5d1f41f68c52e"
    };


    const app =
      initializeApp(
        firebaseConfig
      );


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);



    /* ==========================================
       PERSISTENCIA DE SESIÓN
    =========================================== */

    try {

      await setPersistence(
        auth,
        browserLocalPersistence
      );

    } catch (error) {

      console.error(
        "Error de persistencia:",
        error
      );
    }



    /* ==========================================
       ELEMENTOS
    =========================================== */

    const pantallaLogin =
      document.getElementById(
        "pantallaLogin"
      );


    const pantallaApp =
      document.getElementById(
        "pantallaApp"
      );


    const emailInput =
      document.getElementById(
        "email"
      );


    const passwordInput =
      document.getElementById(
        "password"
      );


    const botonLogin =
      document.getElementById(
        "botonLogin"
      );


    const botonSalir =
      document.getElementById(
        "botonSalir"
      );


    const botonPrueba =
      document.getElementById(
        "botonPrueba"
      );


    const estadoLogin =
      document.getElementById(
        "estadoLogin"
      );


    const estado =
      document.getElementById(
        "estado"
      );


    const usuarioActivo =
      document.getElementById(
        "usuarioActivo"
      );



    /* ==========================================
       ESTADO DE AUTENTICACIÓN
    =========================================== */

    onAuthStateChanged(
      auth,
      usuario => {

        if (usuario) {

          pantallaLogin.style.display =
            "none";


          pantallaApp.style.display =
            "block";


          usuarioActivo.textContent =
            usuario.email;


          passwordInput.value =
            "";


        } else {

          pantallaApp.style.display =
            "none";


          pantallaLogin.style.display =
            "block";


          usuarioActivo.textContent =
            "";


          estado.className =
            "estado";
        }
      }
    );



    /* ==========================================
       LOGIN
    =========================================== */

    botonLogin.addEventListener(
      "click",
      iniciarSesion
    );


    passwordInput.addEventListener(
      "keydown",
      evento => {

        if (evento.key === "Enter") {
          iniciarSesion();
        }
      }
    );


    async function iniciarSesion() {

      const email =
        emailInput.value.trim();


      const password =
        passwordInput.value;


      if (!email || !password) {

        mostrarErrorLogin(
          "Introduce el correo y la contraseña."
        );

        return;
      }


      botonLogin.disabled =
        true;


      botonLogin.textContent =
        "Entrando...";


      estadoLogin.className =
        "estado cargando";


      estadoLogin.textContent =
        "Comprobando acceso...";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        estadoLogin.className =
          "estado";


      } catch (error) {

        console.error(error);


        mostrarErrorLogin(
          "Correo o contraseña incorrectos."
        );

      } finally {

        botonLogin.disabled =
          false;


        botonLogin.textContent =
          "Entrar";
      }
    }



    function mostrarErrorLogin(mensaje) {

      estadoLogin.className =
        "estado error";


      estadoLogin.textContent =
        mensaje;
    }



    /* ==========================================
       CERRAR SESIÓN
    =========================================== */

    botonSalir.addEventListener(
      "click",
      async () => {

        await signOut(auth);

      }
    );



    /* ==========================================
       PRUEBA REAL DE FIRESTORE
    =========================================== */

    botonPrueba.addEventListener(
      "click",
      probarFirestore
    );


    async function probarFirestore() {

      const usuario =
        auth.currentUser;


      if (!usuario) {

        estado.className =
          "estado error";


        estado.textContent =
          "No hay una sesión iniciada.";

        return;
      }


      botonPrueba.disabled =
        true;


      botonPrueba.textContent =
        "Probando...";


      estado.className =
        "estado cargando";


      estado.textContent =
        "Guardando y leyendo una prueba en Firestore...";


      try {

        /*
         * Creamos un único documento técnico.
         * No contiene datos de la agenda.
         */

        const referencia =
          doc(
            db,
            "sistema",
            "prueba"
          );


        await setDoc(
          referencia,
          {
            correcto: true,
            usuario: usuario.email,
            uid: usuario.uid,
            actualizado: serverTimestamp()
          }
        );


        const lectura =
          await getDoc(
            referencia
          );


        if (
          !lectura.exists() ||
          lectura.data().correcto !== true
        ) {

          throw new Error(
            "No se pudo verificar la lectura."
          );
        }


        estado.className =
          "estado correcto";


        estado.textContent =
          "¡Conexión correcta! Family Hub ya puede guardar y leer datos de Firestore.";


        botonPrueba.textContent =
          "Probar de nuevo";


      } catch (error) {

        console.error(error);


        estado.className =
          "estado error";


        estado.textContent =
          "No se ha podido conectar con Firestore: " +
          error.message;


        botonPrueba.textContent =
          "Probar de nuevo";


      } finally {

        botonPrueba.disabled =
          false;
      }
    }

  </script>

</body>
</html>
