<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family Hub">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="./manifest.json">
<title>Family Hub</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 background:#f5f7fb;color:#172033;
 padding-top:env(safe-area-inset-top);
 padding-bottom:calc(76px + env(safe-area-inset-bottom))
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{
 position:sticky;top:0;z-index:20;background:rgba(245,247,251,.96);
 backdrop-filter:blur(12px);padding:14px 18px 10px;border-bottom:1px solid #e5e7eb
}
.cabecera{max-width:700px;margin:auto;display:flex;align-items:center;justify-content:space-between}
.marca{display:flex;align-items:center;gap:10px}
.logo{
 width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,#2563eb,#6d28d9);color:white;font-weight:900;font-size:14px
}
.titulo{font-size:20px;font-weight:900}
.sub{font-size:11px;color:#667085;margin-top:2px}
.salir{border:0;background:#e9eef8;color:#344054;border-radius:10px;padding:9px 11px;font-size:12px;font-weight:800}
main{max-width:700px;margin:auto;padding:18px}
.pantalla{display:none}.pantalla.activa{display:block}

.bienvenida{margin-bottom:18px}
.bienvenida h1,.cabPantalla h1{margin:0;font-size:28px}
.bienvenida p{margin:6px 0 0;color:#667085}
.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px}
.dato{background:white;border-radius:16px;padding:16px 8px;text-align:center;box-shadow:0 4px 16px rgba(15,23,42,.05)}
.numero{display:block;font-size:25px;font-weight:900}
.etiqueta{display:block;margin-top:3px;color:#667085;font-size:10px;font-weight:800;text-transform:uppercase}
.tarjeta{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 16px rgba(15,23,42,.05)}
.tarjeta h2{font-size:18px;margin:0 0 14px}

.evento,.tarea{padding:13px 0;border-bottom:1px solid #eaecf0;display:flex;gap:11px;align-items:flex-start}
.evento:last-child,.tarea:last-child{border-bottom:0}
.evento{cursor:pointer}
.barra{width:5px;align-self:stretch;min-height:46px;border-radius:6px;background:#2563eb}
.evento-contenido,.tarea-contenido{flex:1;min-width:0}
.evento-titulo,.tarea-titulo{font-weight:800}
.evento-meta,.tarea-meta{font-size:13px;color:#667085;margin-top:4px}
.evento-personas,.tarea-personas{font-size:12px;color:#667085;margin-top:5px}
.vacio{color:#98a2b3;text-align:center;padding:18px 5px;font-size:14px}

.filtros{display:flex;gap:7px;overflow:auto;padding-bottom:5px;margin-bottom:14px}
.filtro{white-space:nowrap;border:1px solid #d0d5dd;background:white;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;color:#475467}
.filtro.activo{background:#172033;color:white;border-color:#172033}

.cabAgenda,.cabPantalla{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.cabAgenda h1{font-size:25px;margin:0}
.vistas{display:grid;grid-template-columns:repeat(3,1fr);background:#e9eef8;border-radius:12px;padding:4px;margin-bottom:12px}
.vistaBtn{border:0;background:transparent;padding:9px;border-radius:9px;color:#667085;font-size:13px;font-weight:900}
.vistaBtn.activo{background:white;color:#2563eb;box-shadow:0 2px 8px rgba(15,23,42,.08)}
.navegadorFecha{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
.navFecha{width:38px;height:38px;border:0;border-radius:11px;background:white;color:#344054;font-size:20px;font-weight:900;box-shadow:0 2px 8px rgba(15,23,42,.05)}
.tituloPeriodo{flex:1;text-align:center;font-weight:900}
.hoyBtn{border:0;background:#e9eef8;color:#2563eb;padding:9px 11px;border-radius:10px;font-size:12px;font-weight:900}
.contadorPeriodo{text-align:center;color:#667085;font-size:11px;font-weight:700;margin-bottom:13px;min-height:15px}

.semanaCompacta{background:white;border-radius:18px;padding:10px 6px;box-shadow:0 4px 16px rgba(15,23,42,.05);margin-bottom:12px}
.franjaSemana{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.diaCompacto{border:0;background:transparent;border-radius:13px;min-width:0;padding:7px 2px;color:#172033}
.diaCompacto:active{transform:scale(.94);background:#eaf2ff}
.letraDia{display:block;font-size:10px;font-weight:900;color:#667085;text-transform:uppercase;margin-bottom:5px}
.numeroDiaCompacto{width:32px;height:32px;margin:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900}
.diaCompacto.hoy .numeroDiaCompacto{background:#2563eb;color:white}
.diaCompacto.hoy .letraDia{color:#2563eb}
.puntosSemana{height:11px;display:flex;align-items:center;justify-content:center;gap:2px;margin-top:4px;overflow:hidden}
.puntoSemana{width:6px;height:6px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.08)}

.resumenSemana{background:white;border-radius:18px;padding:4px 16px;box-shadow:0 4px 16px rgba(15,23,42,.05)}
.bloqueDiaSemana{padding:9px 0;border-bottom:1px solid #eaecf0}
.bloqueDiaSemana:last-child{border-bottom:0}
.bloqueDiaSemana.sinEventos{padding:6px 0}
.bloqueDiaSemana.esHoy{margin:4px -8px;padding-left:8px;padding-right:8px;border-radius:12px;background:#f0f6ff}
.cabResumenDia{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.fechaResumenDia{font-size:13px;font-weight:900}
.bloqueDiaSemana.esHoy .fechaResumenDia{color:#2563eb}
.contadorDia{font-size:10px;font-weight:800;color:#667085;background:#f2f4f7;border-radius:999px;padding:4px 7px}
.hoyMini{color:#2563eb;background:#dbeafe;font-size:9px;font-weight:900;border-radius:999px;padding:3px 6px;margin-left:6px}
.eventoSemanaLinea{display:flex;align-items:center;gap:8px;padding:8px 4px;margin-top:5px;border-radius:10px;cursor:pointer}
.eventoSemanaLinea:active{background:#f2f4f7}
.barraSemana{width:4px;min-width:4px;height:34px;border-radius:5px}
.horaSemana{min-width:46px;color:#667085;font-size:11px;font-weight:800}
.textoSemana{flex:1;min-width:0}
.tituloSemanaEvento{font-weight:800;font-size:13px}
.personasSemana{font-size:10px;color:#98a2b3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sinEventosSemana{color:#98a2b3;font-size:11px;margin-left:auto}

.calendario{background:white;border-radius:18px;padding:12px;box-shadow:0 4px 16px rgba(15,23,42,.05)}
.cabCalendario,.rejillaMes{display:grid;grid-template-columns:repeat(7,1fr)}
.cabCalendario div{text-align:center;font-size:11px;font-weight:900;color:#667085;padding:7px 0}
.celdaDia{min-height:70px;padding:5px 3px;border-radius:10px;cursor:pointer;overflow:hidden;touch-action:manipulation}
.celdaDia:active{background:#eaf2ff}
.celdaVacia{min-height:70px}
.celdaDia.seleccionado{background:#eaf2ff;outline:2px solid #bfdbfe}
.numMes{width:27px;height:27px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px;font-weight:800}
.celdaDia.hoy .numMes{background:#2563eb;color:white}
.puntosMes{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.puntoMes{width:6px;height:6px;border-radius:50%}
.masMes{text-align:center;font-size:9px;color:#667085;margin-top:2px}
.detalleMes{margin-top:14px}

.estado-tareas{display:flex;gap:7px;margin-bottom:14px;overflow:auto}
.progreso{height:7px;background:#eaecf0;border-radius:10px;overflow:hidden;margin-top:9px}
.progreso span{display:block;height:100%;background:#2563eb;border-radius:10px}
.completarTarea{width:23px;height:23px;min-width:23px;border-radius:50%;border:2px solid #98a2b3;background:white;padding:0}
.completarTarea.hecha{background:#16a34a;border-color:#16a34a;color:white}
.tarea.completada .tarea-titulo{text-decoration:line-through;color:#98a2b3}
.tarea.vencida{background:#fff7f7;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:12px}
.tarea.hoyTarea{background:#f7fbff;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:12px}
.estadoVencida{color:#b42318;font-weight:900}
.estadoHoy{color:#2563eb;font-weight:900}
.nuevoCheck{display:flex;gap:8px;margin-bottom:8px}
.nuevoCheck input{flex:1}
.nuevoCheck button{border:0;border-radius:10px;background:#eef2f6;padding:0 13px;font-weight:900}
.itemEditor{display:flex;gap:8px;align-items:center;background:#f8fafc;border-radius:10px;padding:9px;margin-top:7px}
.itemEditor span{flex:1;font-size:13px}
.itemEditor button{border:0;background:transparent;color:#b42318;font-weight:900}

.semanaInicioDia{margin-bottom:15px}
.semanaInicioTitulo{font-size:12px;font-weight:900;color:#475467;margin-bottom:4px}
.semanaInicioTitulo.hoy{color:#2563eb}

.modal-fondo{display:none;position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.45);padding:20px;align-items:flex-end;justify-content:center}
.modal-fondo.visible{display:flex}
.modal{background:white;width:100%;max-width:600px;max-height:90vh;overflow:auto;border-radius:24px 24px 16px 16px;padding:22px}
.modal h2{margin:0 0 18px}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:12px;font-weight:800;margin-bottom:6px;color:#344054}
.campo input,.campo select,.campo textarea{width:100%;border:1px solid #d0d5dd;border-radius:11px;padding:12px;background:white;color:#172033}
.campo textarea{min-height:75px;resize:vertical}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{border:1px solid #d0d5dd;border-radius:999px;padding:8px 11px;font-size:12px}
.check input{width:auto;margin-right:5px}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.cancelar,.guardar,.editarFicha,.eliminarFicha,.duplicarFicha{border:0;border-radius:12px;padding:13px;font-weight:900}
.cancelar{background:#eef2f6;color:#344054}
.guardar,.editarFicha{background:#2563eb;color:white}
.eliminarFicha{background:#fef2f2;color:#b42318}
.duplicarFicha{background:#eef2ff;color:#4338ca}
.fichaEventoTitulo{font-size:24px;font-weight:900;margin:4px 0 18px}
.fichaFila{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #eaecf0}
.fichaIcono{width:28px;text-align:center;font-size:18px}
.fichaTexto{flex:1}
.fichaLabel{font-size:10px;color:#98a2b3;font-weight:900;text-transform:uppercase}
.fichaValor{margin-top:3px;font-size:14px;font-weight:700}
.accionesFicha{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.cerrarFicha{width:100%;margin-top:10px;border:0;border-radius:12px;padding:12px;background:#eef2f6;color:#344054;font-weight:900}

.login{min-height:75vh;display:flex;align-items:center;justify-content:center}
.loginbox{width:100%;max-width:430px;background:white;padding:24px;border-radius:22px;box-shadow:0 8px 28px rgba(15,23,42,.08)}
.loginbox h1{margin-top:0}
.loginbox input{width:100%;padding:14px;margin-top:12px;border:1px solid #d0d5dd;border-radius:12px}
.loginbox button{width:100%;margin-top:15px;padding:14px;border:0;border-radius:12px;background:#2563eb;color:white;font-weight:900}
.error{color:#b42318;margin-top:12px;font-size:13px}

.fab{
 position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));
 min-width:54px;height:54px;border-radius:27px;border:0;
 background:#2563eb;color:white;font-size:14px;font-weight:900;
 padding:0 18px;box-shadow:0 8px 20px rgba(37,99,235,.3);z-index:30
}
nav{
 position:fixed;bottom:0;left:0;right:0;z-index:25;
 height:calc(68px + env(safe-area-inset-bottom));
 padding-bottom:env(safe-area-inset-bottom);
 background:white;border-top:1px solid #e5e7eb;display:flex
}
.navbtn{flex:1;border:0;background:white;color:#667085;font-size:12px;font-weight:800}
.navbtn.activo{color:#2563eb}

@media(max-width:430px){
 main{padding:15px;padding-bottom:35px}
 .bienvenida h1,.cabPantalla h1{font-size:25px}
 .tarjeta{padding:16px}
 .celdaDia,.celdaVacia{min-height:62px;padding:4px 2px}
 .semanaCompacta{padding:9px 4px}
 .numeroDiaCompacto{width:30px;height:30px}
 .accionesFicha{grid-template-columns:1fr 1fr}
 .duplicarFicha{grid-column:1/-1}
}
</style>
</head>

<body>

<div id="login" class="login" style="display:none">
<div class="loginbox">
<h1>Family Hub</h1>
<p style="color:#667085">Agenda y organización familiar</p>
<input id="email" type="email" placeholder="Correo electrónico" autocomplete="username">
<input id="password" type="password" placeholder="Contraseña" autocomplete="current-password">
<button id="entrar">Entrar</button>
<div id="errorLogin" class="error"></div>
</div>
</div>

<div id="app" style="display:none">

<header>
<div class="cabecera">
<div class="marca">
<div class="logo">D&amp;N</div>
<div><div class="titulo">Family Hub</div><div id="usuario" class="sub"></div></div>
</div>
<button id="salir" class="salir">Salir</button>
</div>
</header>

<main>

<section id="inicio" class="pantalla activa">
<div class="bienvenida"><h1>Inicio</h1><p id="fechaHoy"></p></div>

<div class="resumen">
<div class="dato"><span id="nHoy" class="numero">0</span><span class="etiqueta">Hoy</span></div>
<div class="dato"><span id="nTareas" class="numero">0</span><span class="etiqueta">Tareas</span></div>
<div class="dato"><span id="nFamilia" class="numero">0</span><span class="etiqueta">Familia</span></div>
</div>

<div class="tarjeta"><h2>Hoy</h2><div id="eventosHoy"></div></div>
<div class="tarjeta"><h2>Tareas que requieren atención</h2><div id="tareasInicio"></div></div>
<div class="tarjeta"><h2>Esta semana</h2><div id="estaSemana"></div></div>
</section>

<section id="agenda" class="pantalla">
<div class="cabAgenda"><h1>Agenda</h1><button id="irHoy" class="hoyBtn">Hoy</button></div>

<div class="vistas">
<button class="vistaBtn activo" data-vista="dia">Día</button>
<button class="vistaBtn" data-vista="semana">Semana</button>
<button class="vistaBtn" data-vista="mes">Mes</button>
</div>

<div class="navegadorFecha">
<button id="anterior" class="navFecha">‹</button>
<div id="tituloPeriodo" class="tituloPeriodo"></div>
<button id="siguiente" class="navFecha">›</button>
</div>

<div id="contadorPeriodo" class="contadorPeriodo"></div>
<div id="filtrosAgenda" class="filtros"></div>
<div id="vistaDia"></div>
<div id="vistaSemana" style="display:none"></div>
<div id="vistaMes" style="display:none"></div>
</section>

<section id="tareas" class="pantalla">
<div class="cabPantalla"><h1>Tareas</h1></div>
<div id="filtrosTareas" class="filtros"></div>

<div class="estado-tareas">
<button class="filtro activo" data-estado="pendientes">Pendientes</button>
<button class="filtro" data-estado="todas">Todas</button>
<button class="filtro" data-estado="completadas">Completadas</button>
</div>

<div class="tarjeta"><div id="listaTareas"></div></div>
</section>

</main>

<button id="fab" class="fab">+ Evento</button>

<nav>
<button class="navbtn activo" data-pantalla="inicio">Inicio</button>
<button class="navbtn" data-pantalla="agenda">Agenda</button>
<button class="navbtn" data-pantalla="tareas">Tareas</button>
</nav>
</div>

<!-- EVENTO -->
<div id="modalEvento" class="modal-fondo">
<div class="modal">

<h2 id="tituloModalEvento">Nuevo evento</h2>

<div class="campo">
<label>Actividad</label>
<input id="actividad" type="text" placeholder="¿Qué hay que hacer?">
</div>

<div class="dos">
<div class="campo"><label>Fecha de inicio</label><input id="fechaEvento" type="date"></div>
<div class="campo"><label>Fecha de fin</label><input id="fechaFinEvento" type="date"></div>
</div>

<div class="campo"><label><input id="todoDia" type="checkbox"> Todo el día</label></div>

<div id="horas" class="dos">
<div class="campo"><label>Hora inicio</label><input id="horaInicio" type="time"></div>
<div class="campo"><label>Hora fin</label><input id="horaFin" type="time"></div>
</div>

<div class="campo"><label>Participantes</label><div id="participantes" class="checks"></div></div>

<div class="campo"><label>Lugar</label><input id="lugar" type="text"></div>

<div class="dos">
<div class="campo">
<label>Categoría</label>
<select id="categoria">
<option>Familia</option><option>Colegio</option><option>Trabajo</option>
<option>Salud</option><option>Ocio</option><option>Otro</option>
</select>
</div>

<div class="campo">
<label>Prioridad</label>
<select id="prioridad"><option>Normal</option><option>Alta</option><option>Baja</option></select>
</div>
</div>

<div class="campo">
<label>Repetición</label>
<select id="repeticion">
<option value="">No repetir</option>
<option>Semanal</option>
<option>Mensual</option>
<option>Anual</option>
</select>
</div>

<div id="opcionesRepeticion" style="display:none">
<div class="dos">
<div class="campo">
<label>Repetir cada</label>
<input id="intervaloRepeticion" type="number" min="1" max="99" value="1">
</div>
<div class="campo">
<label>Unidad</label>
<input id="unidadRepeticion" type="text" disabled value="">
</div>
</div>

<div class="campo">
<label>Repetir hasta</label>
<input id="finRepeticion" type="date">
</div>
</div>

<div class="campo"><label>Notas</label><textarea id="notas"></textarea></div>

<div class="acciones">
<button id="cancelarEvento" class="cancelar">Cancelar</button>
<button id="guardarEvento" class="guardar">Guardar</button>
</div>

</div>
</div>

<!-- FICHA EVENTO -->
<div id="modalFicha" class="modal-fondo">
<div class="modal">
<div id="fichaEvento"></div>

<div class="accionesFicha">
<button id="editarEvento" class="editarFicha">Editar</button>
<button id="eliminarEvento" class="eliminarFicha">Eliminar</button>
<button id="duplicarEvento" class="duplicarFicha">Duplicar</button>
</div>

<button id="cerrarFicha" class="cerrarFicha">Cerrar</button>
</div>
</div>

<!-- TAREA -->
<div id="modalTarea" class="modal-fondo">
<div class="modal">

<h2 id="tituloModalTarea">Nueva tarea</h2>

<div class="campo">
<label>Título</label>
<input id="tituloTarea" type="text" placeholder="¿Qué hay que hacer?">
</div>

<div class="campo"><label>Responsables</label><div id="responsables" class="checks"></div></div>

<div class="campo"><label>Fecha límite</label><input id="fechaLimite" type="date"></div>

<div class="dos">
<div class="campo">
<label>Prioridad</label>
<select id="prioridadTarea"><option>Normal</option><option>Alta</option><option>Baja</option></select>
</div>

<div class="campo">
<label>Categoría</label>
<select id="categoriaTarea">
<option>Familia</option><option>Casa</option><option>Colegio</option>
<option>Trabajo</option><option>Compras</option><option>Salud</option><option>Otro</option>
</select>
</div>
</div>

<div class="campo">
<label>Repetición</label>
<select id="repeticionTarea">
<option value="">No repetir</option>
<option>Semanal</option>
<option>Mensual</option>
<option>Anual</option>
</select>
</div>

<div id="opcionesRepeticionTarea" style="display:none">
<div class="dos">
<div class="campo">
<label>Repetir cada</label>
<input id="intervaloTarea" type="number" min="1" max="99" value="1">
</div>
<div class="campo">
<label>Hasta</label>
<input id="finRepeticionTarea" type="date">
</div>
</div>
</div>

<div class="campo">
<label>Checklist</label>
<div class="nuevoCheck">
<input id="textoCheck" type="text" placeholder="Añadir paso...">
<button id="anadirCheck" type="button">+</button>
</div>
<div id="editorChecklist"></div>
</div>

/* =========================
   FECHAS
========================= */

function fechaLocal(d=new Date()){
 const y=d.getFullYear();
 const m=String(d.getMonth()+1).padStart(2,"0");
 const dia=String(d.getDate()).padStart(2,"0");
 return `${y}-${m}-${dia}`;
}

function desdeFechaLocal(s){
 const [y,m,d]=s.split("-").map(Number);
 return new Date(y,m-1,d,12);
}

function sumarDias(f,n){
 const d=new Date(f);
 d.setDate(d.getDate()+n);
 d.setHours(12,0,0,0);
 return d;
}

function lunesDeSemana(f){
 const d=new Date(f);
 const x=d.getDay();
 d.setDate(d.getDate()+(x===0?-6:1-x));
 d.setHours(12,0,0,0);
 return d;
}

function mismoDia(a,b){
 return fechaLocal(a)===fechaLocal(b);
}

function capitalizarPrimera(t=""){
 return t.charAt(0).toUpperCase()+t.slice(1);
}

function escapar(t=""){
 const d=document.createElement("div");
 d.textContent=String(t);
 return d.innerHTML;
}

function fechaBonita(f){
 if(!f)return "";
 const d=desdeFechaLocal(f);
 const dia=new Intl.DateTimeFormat("es-ES",{weekday:"long"}).format(d);
 const mes=new Intl.DateTimeFormat("es-ES",{month:"long"}).format(d);
 return `${capitalizarPrimera(dia)}, ${d.getDate()} de ${mes}`;
}

function tituloMes(f){
 const m=new Intl.DateTimeFormat("es-ES",{month:"long"}).format(f);
 return `${capitalizarPrimera(m)} de ${f.getFullYear()}`;
}

function tituloSemana(l,d){
 if(l.getMonth()===d.getMonth()&&l.getFullYear()===d.getFullYear()){
  const m=new Intl.DateTimeFormat("es-ES",{month:"long"}).format(l);
  return `${l.getDate()} – ${d.getDate()} ${m}`;
 }

 const a=new Intl.DateTimeFormat("es-ES",{day:"numeric",month:"short"})
  .format(l).replace(".","");
 const b=new Intl.DateTimeFormat("es-ES",{day:"numeric",month:"short"})
  .format(d).replace(".","");

 return `${a} – ${b}`;
}

function diasEntre(a,b){
 const x=desdeFechaLocal(a);
 const y=desdeFechaLocal(b);
 return Math.round((y-x)/86400000);
}

function mesesEntre(a,b){
 return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
}

function ultimoDiaMes(y,m){
 return new Date(y,m+1,0,12).getDate();
}

function fechaMensualValida(inicio,objetivo,intervalo){
 const diferencia=mesesEntre(inicio,objetivo);
 if(diferencia<0 || diferencia%intervalo!==0)return false;

 const diaOriginal=inicio.getDate();
 const ultimo=ultimoDiaMes(objetivo.getFullYear(),objetivo.getMonth());
 const esperado=Math.min(diaOriginal,ultimo);

 return objetivo.getDate()===esperado;
}

function fechaAnualValida(inicio,objetivo,intervalo){
 const dif=objetivo.getFullYear()-inicio.getFullYear();
 if(dif<0 || dif%intervalo!==0)return false;

 if(objetivo.getMonth()!==inicio.getMonth())return false;

 const ultimo=ultimoDiaMes(objetivo.getFullYear(),objetivo.getMonth());
 const esperado=Math.min(inicio.getDate(),ultimo);

 return objetivo.getDate()===esperado;
}

/* =========================

========================= */

function colorPersonas(n=[]){
 if(n.length===1)
  return familia.find(x=>x.nombre===n[0])?.color||"#2563eb";

 const c=n
  .map(v=>familia.find(x=>x.nombre===v)?.color)
  .filter(Boolean);

 return c.length>1
  ?`linear-gradient(90deg,${c.join(",")})`
  :(c[0]||"#43A047");
}

function colorSimple(n=[]){
 return n.length
  ?(familia.find(x=>x.nombre===n[0])?.color||"#2563eb")
  :"#43A047";
}

function textoHora(e){
 return e.todoDia
  ?"Todo el día"
  :(e.horaInicio&&e.horaFin
   ?`${e.horaInicio}–${e.horaFin}`
   :(e.horaInicio||""));
}

/* =========================
   EVENTOS / RECURRENCIAS
========================= */

function fechaEnExcepciones(e,fecha){
 return Array.isArray(e.excepciones) && e.excepciones.includes(fecha);
}

function duracionEvento(e){
 if(!e.fechaFin || e.fechaFin<e.fecha)return 0;
 return diasEntre(e.fecha,e.fechaFin);
}

function inicioRecurrenteEnFecha(e,fecha){
 if(!e.fecha || fecha<e.fecha)return false;

 if(e.finRepeticion && fecha>e.finRepeticion)return false;

 if(fechaEnExcepciones(e,fecha))return false;

 if(fecha===e.fecha)return true;

 if(!e.repeticion)return false;

 const inicio=desdeFechaLocal(e.fecha);
 const objetivo=desdeFechaLocal(fecha);
 const intervalo=Math.max(1,Number(e.intervaloRepeticion)||1);

 if(e.repeticion==="Semanal"){
  const dif=diasEntre(e.fecha,fecha);
  return dif>=0 && dif%(7*intervalo)===0;
 }

 if(e.repeticion==="Mensual"){
  return fechaMensualValida(inicio,objetivo,intervalo);
 }

 if(e.repeticion==="Anual"){
  return fechaAnualValida(inicio,objetivo,intervalo);
 }

 return false;
}

function inicioAparicionQueContiene(e,fecha){
 const objetivo=desdeFechaLocal(fecha);
 const duracion=duracionEvento(e);

 for(let i=0;i<=duracion;i++){
  const posible=fechaLocal(sumarDias(objetivo,-i));

  if(inicioRecurrenteEnFecha(e,posible)){
   return posible;
  }
 }

 return null;
}

function ocurreEnFecha(e,fecha){
 return !!inicioAparicionQueContiene(e,fecha);
}

function eventosEnFecha(fecha){
 return eventosFiltrados()
  .filter(e=>ocurreEnFecha(e,fecha))
  .map(e=>({
   ...e,
   fechaAparicion:inicioAparicionQueContiene(e,fecha)
  }));
}

function aparicionesEntre(inicio,fin){
 const resultado=[];

 for(let d=new Date(inicio);d<=fin;d=sumarDias(d,1)){
  const f=fechaLocal(d);

  eventosEnFecha(f).forEach(e=>{
   resultado.push({...e,fechaVista:f});
  });
 }

 return resultado;
}

 });

function escucharEventos(){

 unsubscribeEventos=onSnapshot(
  collection(db,"eventos"),
  s=>{
   eventos=s.docs.map(d=>({id:d.id,...d.data()}));

   eventos.sort((a,b)=>
    ((a.fecha||"")+" "+(a.horaInicio||""))
    .localeCompare((b.fecha||"")+" "+(b.horaInicio||""))
   );

   renderTodo();
  }
 );
}

function escucharTareas(){
 if(unsubscribeTareas)unsubscribeTareas();

 unsubscribeTareas=onSnapshot(
  collection(db,"tareas"),
  s=>{
   tareas=s.docs.map(d=>({id:d.id,...d.data()}));

 );

 $("modalFicha").classList.remove("visible");

};

$("editarEvento").onclick=async()=>{
 if(!eventoSeleccionado)return;

 if(
  eventoSeleccionado.repeticion &&
  aparicionSeleccionada &&
  aparicionSeleccionada!==eventoSeleccionado.fecha
 ){
  const solo=confirm(
   "Aceptar = editar SOLO esta aparición.\n\nCancelar = editar TODA la serie."
  );

  if(solo){
   const original=eventoSeleccionado;
   const fechaExcepcion=aparicionSeleccionada;

   const nuevas=[
    ...new Set([...(original.excepciones||[]),fechaExcepcion])
   ];

   await updateDoc(
    doc(db,"eventos",original.id),
    {excepciones:nuevas}
   );

   const copia={
    ...original,
    fecha:fechaExcepcion,
    fechaFin:duracionEvento(original)>0
     ?fechaLocal(sumarDias(desdeFechaLocal(fechaExcepcion),duracionEvento(original)))
     :fechaExcepcion,
    repeticion:"",
    finRepeticion:"",
    intervaloRepeticion:1,
    excepciones:[]
   };

   delete copia.id;

   $("modalFicha").classList.remove("visible");
   abrirEvento(null,copia);
   return;
  }
 }

 $("modalFicha").classList.remove("visible");
 abrirEvento(eventoSeleccionado);
};

$("eliminarEvento").onclick=async()=>{
 if(!eventoSeleccionado)return;

 if(
  eventoSeleccionado.repeticion &&
  aparicionSeleccionada
 ){
  const solo=confirm(
   "Aceptar = eliminar SOLO esta aparición.\n\nCancelar = continuar para decidir sobre toda la serie."
  );

  if(solo){
   const excepciones=[
    ...new Set([
     ...(eventoSeleccionado.excepciones||[]),
     aparicionSeleccionada
    ])
   ];

   await updateDoc(
    doc(db,"eventos",eventoSeleccionado.id),
    {excepciones}
   );

   $("modalFicha").classList.remove("visible");
   eventoSeleccionado=null;
   aparicionSeleccionada=null;
   return;
  }
 }

 if(confirm(`¿Eliminar "${eventoSeleccionado.actividad}"?`)){
  await deleteDoc(
   doc(db,"eventos",eventoSeleccionado.id)
  );

  $("modalFicha").classList.remove("visible");
  eventoSeleccionado=null;
  aparicionSeleccionada=null;
 }
};

$("duplicarEvento").onclick=()=>{
 if(!eventoSeleccionado)return;

 const copia={...eventoSeleccionado};
 delete copia.id;

 if(aparicionSeleccionada){
  copia.fecha=aparicionSeleccionada;

  if(duracionEvento(eventoSeleccionado)>0){
   copia.fechaFin=fechaLocal(
    sumarDias(
     desdeFechaLocal(aparicionSeleccionada),
     duracionEvento(eventoSeleccionado)
    )
   );
  }
 }

 copia.repeticion="";
 copia.finRepeticion="";
 copia.intervaloRepeticion=1;
 copia.excepciones=[];

 $("modalFicha").classList.remove("visible");
 abrirEvento(null,copia);
};

function estadoFechaTarea(t){
 if(t.completada||!t.fechaLimite)return "";

 const h=fechaLocal();

 if(t.fechaLimite<h)return "vencida";
 if(t.fechaLimite===h)return "hoy";

 return "";
}

function prioridadNumero(p){
 return p==="Alta"?0:p==="Normal"?1:2;
}

function ordenarTareas(lista){
 const hoy=fechaLocal();

 return [...lista].sort((a,b)=>{

  const grupo=t=>{
   if(t.completada)return 4;
   if(t.fechaLimite && t.fechaLimite<hoy)return 0;
   if(t.fechaLimite===hoy)return 1;
   if(t.fechaLimite)return 2;
   return 3;
  };

  const ga=grupo(a);
  const gb=grupo(b);

  if(ga!==gb)return ga-gb;

  const pa=prioridadNumero(a.prioridad);
  const pb=prioridadNumero(b.prioridad);

  if(pa!==pb)return pa-pb;

  return (a.fechaLimite||"9999-12-31")
   .localeCompare(b.fechaLimite||"9999-12-31");
 });
}

function htmlTarea(t){
 const c=Array.isArray(t.checklist)?t.checklist:[];
 const hechos=c.filter(x=>x.hecho).length;

 const pct=c.length
  ?Math.round(hechos/c.length*100)
  :(t.completada?100:0);

 const estado=estadoFechaTarea(t);

 const estadoTxt=
  estado==="vencida"
   ?'<span class="estadoVencida">VENCIDA</span>'
   :estado==="hoy"
    ?'<span class="estadoHoy">HOY</span>'
    :"";

 return `
 <div class="tarea
 ${t.completada?"completada":""}
 ${estado==="vencida"?"vencida":""}
 ${estado==="hoy"?"hoyTarea":""}">

 <button class="completarTarea ${t.completada?"hecha":""}"
         data-completar="${t.id}">
 ${t.completada?"✓":""}
 </button>

 <div class="barra"
      style="background:${colorPersonas(t.responsables||[])}"></div>

 <div class="tarea-contenido"
      data-ver-tarea="${t.id}">

 <div class="tarea-titulo">
 ${escapar(t.titulo||"Sin título")}
 ${t.repeticion?" ↻":""}
 </div>

 <div class="tarea-meta">
 ${estadoTxt}
 ${estadoTxt&&t.fechaLimite?" · ":""}
 ${t.fechaLimite?escapar(fechaBonita(t.fechaLimite)):"Sin fecha"}
 · ${escapar(t.prioridad||"Normal")}
 </div>

 <div class="tarea-personas">
 ${escapar((t.responsables||[]).join(" · "))}
 </div>

 ${
  c.length
   ?`<div class="progreso">
      <span style="width:${pct}%"></span>
     </div>
     <div class="tarea-meta">${hechos}/${c.length} completados</div>`
   :""
 }

 </div>
 </div>`;
}

function siguienteFechaTarea(t){
 const actual=desdeFechaLocal(t.fechaLimite);
 const intervalo=Math.max(1,Number(t.intervaloRepeticion)||1);

 let siguiente;

 if(t.repeticion==="Semanal"){
  siguiente=sumarDias(actual,7*intervalo);
 }

 if(t.repeticion==="Mensual"){
  const objetivo=new Date(
   actual.getFullYear(),
   actual.getMonth()+intervalo,
   1,
   12
  );

  objetivo.setDate(
   Math.min(
    actual.getDate(),
    ultimoDiaMes(
     objetivo.getFullYear(),
     objetivo.getMonth()
    )
   )
  );

  siguiente=objetivo;
 }

 if(t.repeticion==="Anual"){
  const y=actual.getFullYear()+intervalo;
  const m=actual.getMonth();

  siguiente=new Date(
   y,
   m,
   Math.min(
    actual.getDate(),
    ultimoDiaMes(y,m)
   ),
   12
  );
 }

 const f=fechaLocal(siguiente||actual);

 if(t.finRepeticion && f>t.finRepeticion){
  return t.fechaLimite;
 }

 return f;
}

/* pulsación larga */

let temporizadorLargo=null;
let pulsacionLarga=false;

function activarPulsacionLarga(elementos){
 elementos.forEach(x=>{

  const iniciar=e=>{
   pulsacionLarga=false;

   temporizadorLargo=setTimeout(()=>{
    pulsacionLarga=true;

    const fecha=
     x.dataset.fechaMes||
     x.dataset.diaSemana||
     x.dataset.abrirDia;

    if(fecha){
     abrirEvento(null,null,fecha);
    }

   },550);
  };

  const cancelar=()=>{
   clearTimeout(temporizadorLargo);
  };

  x.addEventListener("touchstart",iniciar,{passive:true});
  x.addEventListener("touchend",cancelar);
  x.addEventListener("touchmove",cancelar);

  x.addEventListener("mousedown",iniciar);
  x.addEventListener("mouseup",cancelar);
  x.addEventListener("mouseleave",cancelar);
 });
}

function renderMes(){
 const y=fechaAgenda.getFullYear();
 const m=fechaAgenda.getMonth();

 const primero=new Date(y,m,1,12);
 const dias=new Date(y,m+1,0,12).getDate();

 let huecos=primero.getDay()-1;
 if(huecos<0)huecos=6;

 const total=Math.ceil((huecos+dias)/7)*7;
 const finales=total-huecos-dias;

 const ini=new Date(y,m,1,12);
 const fin=new Date(y,m,dias,12);

 const apps=aparicionesEntre(ini,fin);

 $("tituloPeriodo").textContent=
  tituloMes(fechaAgenda);

 $("contadorPeriodo").textContent=
  `${apps.length} ${apps.length===1?"evento":"eventos"} este mes`;

 let celdas=
  '<div class="celdaVacia"></div>'.repeat(huecos);

 for(let n=1;n<=dias;n++){

  const x=new Date(y,m,n,12);
  const f=fechaLocal(x);
  const lista=eventosEnFecha(f);

  celdas+=`
   <div class="celdaDia
               ${mismoDia(x,new Date())?"hoy":""}
               ${mismoDia(x,fechaAgenda)?"seleccionado":""}"
        data-fecha-mes="${f}">

    <div class="numMes">${n}</div>

    <div class="puntosMes">
     ${lista.slice(0,4).map(e=>
      `<span class="puntoMes"
             style="background:${colorSimple(e.participantes||[])}"></span>`
     ).join("")}
    </div>

    ${
     lista.length>4
      ?`<div class="masMes">+${lista.length-4}</div>`
      :""
    }

   </div>`;
 }

 celdas+=
  '<div class="celdaVacia"></div>'.repeat(finales);

 const fs=fechaLocal(fechaAgenda);
 const lista=eventosEnFecha(fs);

 $("vistaMes").innerHTML=`
  <div class="calendario">

   <div class="cabCalendario">
    <div>L</div><div>M</div><div>X</div>
    <div>J</div><div>V</div><div>S</div><div>D</div>
   </div>

   <div class="rejillaMes">
    ${celdas}
   </div>

  </div>

  <div class="tarjeta detalleMes">
   <h2>${escapar(fechaBonita(fs))}</h2>
   <div id="eventosDiaMes"></div>
  </div>
 `;

 insertarEventos(
  $("eventosDiaMes"),
  lista
 );

 const diasMes=[
  ...$("vistaMes").querySelectorAll("[data-fecha-mes]")
 ];

 diasMes.forEach(x=>{
  x.onclick=()=>{
   if(pulsacionLarga){
    pulsacionLarga=false;
    return;
   }

   fechaAgenda=desdeFechaLocal(
    x.dataset.fechaMes
   );

   renderMes();
  };
 });

 activarPulsacionLarga(diasMes);
}

/* =========================
   RENDER TAREAS
========================= */

function renderTareas(){
 let lista=[...tareas];

 if(filtroTareas!=="Todos"){
  lista=lista.filter(t=>
   (t.responsables||[]).includes(filtroTareas)
  );
 }

 if(estadoTareas==="pendientes"){
  lista=lista.filter(t=>!t.completada);
 }

 if(estadoTareas==="completadas"){
  lista=lista.filter(t=>t.completada);
 }

 insertarTareas(
  $("listaTareas"),
  ordenarTareas(lista)
 );
}

/* =========================
   NAVEGACIÓN
========================= */

document
 .querySelectorAll("[data-vista]")
 .forEach(b=>{
  b.onclick=()=>{
   vistaAgenda=b.dataset.vista;
   renderAgenda();
  };
 });

$("anterior").onclick=()=>{
 if(vistaAgenda==="dia"){
  fechaAgenda=sumarDias(fechaAgenda,-1);
 }
 else if(vistaAgenda==="semana"){
  fechaAgenda=sumarDias(fechaAgenda,-7);
 }
 else{
  fechaAgenda=new Date(
   fechaAgenda.getFullYear(),
   fechaAgenda.getMonth()-1,
   1,
   12
  );
 }

 renderAgenda();
};

$("siguiente").onclick=()=>{
 if(vistaAgenda==="dia"){
  fechaAgenda=sumarDias(fechaAgenda,1);
 }
 else if(vistaAgenda==="semana"){
  fechaAgenda=sumarDias(fechaAgenda,7);
 }
 else{
  fechaAgenda=new Date(
   fechaAgenda.getFullYear(),
   fechaAgenda.getMonth()+1,
   1,
   12
  );
 }

 renderAgenda();
};

$("irHoy").onclick=()=>{
 fechaAgenda=new Date();
 renderAgenda();
};

function actualizarFab(){
 if(pantallaActual==="tareas"){
  $("fab").textContent="+ Tarea";
 }
 else{
  $("fab").textContent="+ Evento";
 }
}

document
 .querySelectorAll(".navbtn[data-pantalla]")
 .forEach(b=>{
  b.onclick=()=>{

   pantallaActual=b.dataset.pantalla;

   document
    .querySelectorAll(".pantalla")
    .forEach(p=>p.classList.remove("activa"));

   document
    .querySelectorAll(".navbtn")
    .forEach(x=>x.classList.remove("activo"));

   $(pantallaActual).classList.add("activa");
   b.classList.add("activo");

   if(pantallaActual==="agenda"){
    renderAgenda();
   }

   actualizarFab();
  };
 });

document
 .querySelectorAll("[data-estado]")
 .forEach(b=>{
  b.onclick=()=>{

   estadoTareas=b.dataset.estado;

   document
    .querySelectorAll("[data-estado]")
    .forEach(x=>x.classList.remove("activo"));

   b.classList.add("activo");

   renderTareas();
  };
 });

$("fab").onclick=()=>{
 if(pantallaActual==="tareas"){
  abrirTarea();
 }else{
  abrirEvento();
 }
};

actualizarFab();

</script>
</body>
</html>
