<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <!-- Configuración para iPhone / iPad -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Family Hub">

  <!-- Color de la aplicación -->
  <meta name="theme-color" content="#2563eb">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">

  <title>Family Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;

      /* Espacio seguro para iPhone con notch */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .contenedor {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 40px auto 20px;
      border-radius: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(135deg, #2563eb, #6d28d9);

      color: white;
      font-size: 24px;
      font-weight: 900;

      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.25);
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.1;
    }

    .subtitulo {
      margin-top: 16px;
      color: #667085;
      font-size: 17px;
    }

    .correcto {
      margin-top: 35px;
      padding: 24px 20px;

      background: white;
      border-radius: 18px;

      box-shadow: 0 7px 24px rgba(15, 23, 42, 0.07);
    }

    .correcto strong {
      display: block;
      font-size: 18px;
      margin-bottom: 12px;
    }

    .correcto p {
      margin: 0;
      color: #667085;
      font-size: 16px;
      line-height: 1.5;
    }

    @media (max-width: 500px) {

      .contenedor {
        padding: 25px 20px;
      }

      .logo {
        margin-top: 55px;
      }

      h1 {
        font-size: 36px;
      }

      .subtitulo {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <div class="logo">
      D&amp;N
    </div>

    <h1>Family Hub</h1>

    <p class="subtitulo">
      Agenda y organización familiar
    </p>

    <section class="correcto">

      <strong>
        Family Hub está funcionando
      </strong>

      <p>
        Esta es la nueva versión móvil.
      </p>

    </section>

  </main>

</body>
</html>
